<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>AI 辦公室</title>
<style>
  :root {
    --bg: #101216; --panel: #16191f; --line: #23272f;
    --text: #d7dbe2; --dim: #7d838d; --accent: #f5c451; --ok: #6fc276;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    font: 14px/1.6 "PingFang TC", "Noto Sans TC", sans-serif;
    display: grid; grid-template-columns: 232px 1fr 400px;
  }
  aside, main, section { height: 100vh; overflow-y: auto; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; }
  aside h1 { font-size: 15px; padding: 0 8px 10px; }
  aside h1 small { color: var(--dim); font-weight: normal; margin-left: 6px; }
  .emp { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .emp:hover { background: #1d212a; }
  .emp.sel { background: #232936; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.busy { background: var(--accent); }
  .emp .who { min-width: 0; }
  .emp .name { font-size: 14px; }
  .emp .role { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .emp .state { margin-left: auto; font-size: 11px; color: var(--dim); flex: none; }
  .status { font-size: 11px; color: var(--dim); padding: 0 8px 10px; line-height: 1.7; }
  .status .warn { color: var(--accent); }

  main { display: flex; align-items: center; justify-content: center; background: #0b0d10; }
  main iframe { width: 100%; height: 100%; border: 0; }
  .placeholder { color: var(--dim); text-align: center; line-height: 2; }

  section { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .head .who { font-size: 16px; }
  .head .task { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #2a2f3a; margin-left: 8px; }
  .badge.working { color: var(--accent); }
  .badge.ok { color: var(--ok); }
  .badge.error, .badge.lost { color: #e07070; }
  .feed { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .ev { margin-bottom: 10px; }
  .ev .at { font-size: 11px; color: var(--dim); }
  .ev .tx { white-space: pre-wrap; word-break: break-word; }
  .report { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; white-space: pre-wrap; word-break: break-word; }
  .tcard { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; background: #131720; }
  .tcard summary {
    cursor: pointer; padding: 9px 12px; display: flex; align-items: center; gap: 8px;
    list-style: none; user-select: none;
  }
  .tcard summary::-webkit-details-marker { display: none; }
  .tcard summary .ttitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcard summary .trange { font-size: 11px; color: var(--dim); flex: none; }
  .tcard .badge { margin-left: 0; flex: none; }
  .tcard .tbody { padding: 4px 12px 10px; border-top: 1px solid var(--line); }
  .composer { border-top: 1px solid var(--line); padding: 12px 16px; }
  .composer textarea {
    width: 100%; background: #0f1115; border: 1px solid var(--line); border-radius: 8px;
    color: var(--dim); padding: 9px 12px; resize: none; font: inherit; height: 62px;
  }
  .composer .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .composer textarea:not(:disabled) { color: var(--text); }
  .inputrow { display: flex; gap: 8px; align-items: stretch; }
  .inputrow textarea { flex: 1; }
  .inputrow button {
    border: 0; border-radius: 8px; padding: 0 18px; font: inherit; cursor: pointer;
    background: var(--accent); color: #241c05;
  }
  .inputrow button:disabled { background: #2a2f3a; color: var(--dim); cursor: default; }
  .empty { color: var(--dim); padding: 40px 16px; text-align: center; }
  .appr { background: #2b2417; border: 1px solid #6d5a2a; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .appr .tx { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .appr .btns { margin-top: 8px; display: flex; gap: 8px; }
  .appr button { border: 0; border-radius: 6px; padding: 5px 16px; font: inherit; cursor: pointer; }
  .appr .yes { background: var(--ok); color: #10240f; }
  .appr .no { background: #3a2c2c; color: #e07070; }
</style>
</head>
<body>
  <aside>
    <h1>員工<small id="count"></small></h1>
    <div id="status" class="status"></div>
    <div id="roster"></div>
  </aside>
  <main id="stage"></main>
  <section>
    <div class="head" id="head"><div class="empty">點左側員工查看工作串</div></div>
    <div class="feed" id="feed"></div>
    <div class="composer">
      <div id="approvalCard" style="display:none"></div>
      <div class="inputrow">
        <textarea id="box" disabled placeholder="先點左側員工，再描述任務…"></textarea>
        <button id="send" disabled onclick="dispatch($('box').value)">送出</button>
      </div>
      <div class="hint" id="hint">Enter 送出、Shift+Enter 換行（需 bot 開 COGITO_HTTP_ADDR）</div>
    </div>
  </section>
<script>
const $ = id => document.getElementById(id);
let selected = null, lastCount = -1, agentsData = {};

// 中間畫布：有 WebGL build 就嵌，沒有就提示
fetch('/unity/index.html', { method: 'HEAD' }).then(r => {
  $('stage').innerHTML = r.ok
    ? '<iframe src="/unity/index.html"></iframe>'
    : '<div class="placeholder">尚無 WebGL build<br>Unity 選單 Tools → Build WebGL (辦公室網頁版)<br>建置完重新整理本頁</div>';
}).catch(() => $('stage').innerHTML = '<div class="placeholder">後端未連線</div>');

async function roster() {
  try {
    const d = await (await fetch('/agents')).json();
    agentsData = d;
    const ids = Object.keys(d);
    $('count').textContent = ids.length || '';
    $('roster').innerHTML = ids.map(id => {
      const a = d[id];
      return `<div class="emp ${id === selected ? 'sel' : ''}" onclick="pick('${id}')">
        <span class="dot ${a.busy ? 'busy' : ''}"></span>
        <span class="who"><div class="name">${a.name}</div><div class="role">${a.role}</div></span>
        <span class="state">${a.busy ? '工作中' : ''}</span></div>`;
    }).join('') || '<div class="empty">後端未載入名冊</div>';
    updateComposer();
    status();
  } catch { $('roster').innerHTML = '<div class="empty">後端未連線</div>'; }
}

// 鏈路健康度：畫面凍結時（WebGL 分頁被瀏覽器暫停，WS 還開著）明講，別讓人猜 NPC 為何不動
async function status() {
  try {
    const s = await (await fetch('/office/status')).json();
    const canvas = !s.canvas ? '<span class="warn">🔴 畫面未連線</span>'
      : s.stale ? '<span class="warn">🟡 畫面無回應——重整分頁</span>'
      : `🟢 畫面已連線${s.canvas > 1 ? `（${s.canvas} 個）` : ''}`;
    const disp = s.dispatch ? '🟢 可派工' : '<span class="warn">🔴 派工未接（COGITO_HTTP）</span>';
    $('status').innerHTML = `${canvas}<br>${disp}`;
  } catch { $('status').textContent = ''; }
}

// 忙碌防呆：選中的員工工作中 → 鎖送出（審批按鈕不受影響，那是任務中互動）
function updateComposer() {
  if (!selected) return;
  const a = agentsData[selected];
  const workingNow = a && a.busy;
  $('box').disabled = workingNow;
  $('send').disabled = workingNow;
  $('box').placeholder = workingNow
    ? `⏳ ${a.name} 工作中——收工後再派新任務`
    : '描述任務派給這位員工…';
}

function pick(id) {
  selected = id; lastCount = -1; roster(); feed();
  updateComposer();
}

async function dispatch(text) {
  if (!selected || !text.trim()) return;
  const r = await (await fetch('/office/dispatch', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent: selected, text: text.trim() }),
  })).json();
  $('hint').textContent = r.ok ? '已交辦 ✓' : `派工失敗：${r.error}`;
  if (r.ok) { $('box').value = ''; feed(); }
}

$('box').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dispatch($('box').value); }
});

const BADGE = { working: '⏳ 進行中', ok: '✔ 已完成', error: '✗ 失敗', lost: '⚠ 失聯' };

async function feed() {
  if (!selected) return;
  try {
    const r = await (await fetch(`/office/report/${selected}`)).json();
    if (!r.ok) {
      $('head').innerHTML = `<div class="who">${selected}</div><div class="task">${r.error}</div>`;
      $('feed').innerHTML = '';
      return;
    }
    $('head').innerHTML = `<div class="who">${r.name}<span class="badge ${r.status}">${BADGE[r.status] || r.status}</span></div>
      <div class="task">最新任務 · ${r.at}　${esc(r.task)}</div>`;
    const f = $('feed');
    const stick = f.scrollTop + f.clientHeight >= f.scrollHeight - 30;
    const cards = r.history || [];
    f.innerHTML = cards.map((t, i) => {
      const evs = (t.events || []).map(e =>
        `<div class="ev"><div class="at">${e.at}</div><div class="tx">${esc(e.text)}</div></div>`).join('');
      const rep = t.report ? `<div class="report">${esc(t.report)}</div>` : '';
      return `<details class="tcard"${i === cards.length - 1 ? ' open' : ''}>
        <summary><span class="badge ${t.status}">${BADGE[t.status] || t.status}</span>
        <span class="ttitle">${esc(t.task)}</span>
        <span class="trange">${t.at}${t.end ? '–' + t.end : ''}</span></summary>
        <div class="tbody">${evs}${rep}</div></details>`;
    }).join('');
    const n = cards.reduce((s, t) => s + (t.events || []).length, 0);
    if (n !== lastCount && stick) f.scrollTop = f.scrollHeight; // 有新事件且原本就在底部才跟捲
    lastCount = n;
    const card = $('approvalCard');
    if (r.approval) {
      card.style.display = 'block';
      card.className = 'appr';
      card.innerHTML = `<div class="tx">${esc(r.approval)}</div>
        <div class="btns"><button class="yes" onclick="dispatch('approve')">核准</button>
        <button class="no" onclick="dispatch('reject')">駁回</button></div>`;
    } else { card.style.display = 'none'; }
  } catch { /* 後端暫時斷線：下輪再試 */ }
}

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 畫布聯動：WebGL 內點 NPC → 右欄切到該員工（同源 iframe，來源與格式都驗過才收）
window.addEventListener('message', e => {
  if (e.origin !== window.location.origin) return;
  const d = e.data;
  if (d && d.source === 'office-canvas' && typeof d.agent === 'string' && agentsData[d.agent]) {
    pick(d.agent);
  }
});

// SSE 即時推播（失效通知）：收到就回抓對應資料；斷線 EventSource 自動重連。
// 慢速輪詢留著當保險（後端重啟等 SSE 銜接空窗）。
const es = new EventSource('/office/stream');
es.onmessage = e => {
  let ev; try { ev = JSON.parse(e.data); } catch { return; }
  if (ev.type === 'roster') roster();
  else if (ev.type === 'agent' && ev.id === selected) feed();
};

roster();
setInterval(roster, 10000);
setInterval(feed, 8000);
</script>
</body>
</html>
