<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>AI 辦公室</title>
<style>
  :root {
    --bg: #101216; --panel: #16191f; --line: #23272f;
    --text: #d7dbe2; --dim: #7d838d; --accent: #f5c451; --ok: #6fc276;
    --card: #131720;   /* 任務卡底色：釘住的標題列要用同一個不透明色蓋住捲過去的內容 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    font: 14px/1.6 "PingFang TC", "Noto Sans TC", sans-serif;
    display: grid; grid-template-columns: var(--rail) 6px 1fr 6px var(--dock);
  }
  /* 右欄寬度：拖把手改這個變數（下面 --dock 的初值），存 localStorage 下次沿用 */
  :root { --rail: 232px; --dock: 400px; }
  .grip { background: var(--line); cursor: col-resize; }
  .grip:hover, body.dragging .grip { background: var(--accent); }
  /* 橫向把手：工作串與輸入區之間那條線。它就是 .composer 原本的上框線，
     只是改成拖得動的——線本來就在那裡，使用者以為可以拖是很自然的期待。 */
  .hgrip { height: 5px; flex: none; background: var(--line); cursor: row-resize; }
  .hgrip:hover, body.vdragging .hgrip { background: var(--accent); }
  body.vdragging { cursor: row-resize; user-select: none; }
  body.vdragging iframe { pointer-events: none; }   /* 同 body.dragging：別讓游標掉進 Unity 畫布 */
  /* 拖曳中讓 iframe 不吃事件——否則游標一進 Unity 畫布就斷開 */
  body.dragging iframe { pointer-events: none; }
  body.dragging { cursor: col-resize; user-select: none; }
  aside, main, section { height: 100vh; overflow-y: auto; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; }
  aside h1 { font-size: 15px; padding: 0 8px 10px; }
  aside h1 small { color: var(--dim); font-weight: normal; margin-left: 6px; }
  .emp { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .emp:hover { background: #1d212a; }
  .emp.sel { background: #232936; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3a4150; flex: none; display: inline-block; }
  .dot.busy { background: var(--accent); margin-right: 5px; }
  .dot.wait { background: #e07070; margin-right: 5px; animation: blink 1.1s infinite; }
  .dot.rate { background: #e0a050; margin-right: 5px; }   /* 額度：卡著但不是在等你決定 */
  /* 待審提案：獨立於「他在做什麼」的另一條軸——是【等你】處理的東西，所以並排不互斥 */
  .memo { font-size: 11px; color: #d9b44a; background: #2a2519; border-radius: 8px;
          padding: 1px 6px; margin-left: 6px; flex: none; }
  @keyframes blink { 50% { opacity: .25; } }
  .mute { cursor: pointer; float: right; opacity: .7; }
  .mute:hover { opacity: 1; }
  .emp .who { min-width: 0; }
  .emp .name { font-size: 14px; }
  .emp .role { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .emp .state { margin-left: auto; font-size: 11px; color: var(--dim); flex: none; white-space: nowrap; }
  /* 能力圖卡：工具與技能是【全員共用】的，所以擺在名冊底下一張，不是每個人一份 */
  .capcard { margin: 10px 2px 0; border-top: 1px solid var(--line); }
  .capcard summary { cursor: pointer; list-style: none; padding: 10px 8px 6px;
                     font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: baseline; }
  .capcard summary::-webkit-details-marker { display: none; }
  .capcard summary:hover { color: var(--text); }
  .capcard summary small { color: #4c525d; }
  /* 兩層收折：卡片 → 工具／技能各一組 → 每一項再點開看說明。
     一次攤開二十幾個工具的說明，在 232px 的欄位裡等於一片字牆。 */
  .capcard .grp .grp > summary { padding-left: 20px; }
  .capcard .grp .grp .it { margin-left: 20px; }
  .capcard .grp .grp .find { width: calc(100% - 28px); margin-left: 20px; }
  .capcard .grp > summary { cursor: pointer; list-style: none; padding: 5px 8px; font-size: 11px;
                            color: #9aa2ae; display: flex; gap: 6px; align-items: baseline; }
  .capcard .grp > summary::-webkit-details-marker { display: none; }
  .capcard .grp > summary:hover { color: var(--text); }
  .capcard .grp > summary .n { margin-left: auto; color: #4c525d; }
  .capcard .find { width: calc(100% - 16px); margin: 2px 8px 4px; background: #0f1115;
                   border: 1px solid var(--line); border-radius: 6px; color: var(--text);
                   font: inherit; font-size: 11px; padding: 3px 7px; }
  .capcard .it { font-size: 11px; color: var(--text); padding: 2px 8px 2px 14px;
                 border-left: 1px solid var(--line); margin-left: 8px; cursor: pointer; }
  .capcard .it:hover { background: #1d212a; }
  .capcard .it .d { display: none; color: var(--dim); padding: 1px 0 3px 2px; }
  .capcard .it.open .d { display: block; }
  .capcard .it[hidden] { display: none; }
  .capcard .err { font-size: 11px; color: var(--dim); padding: 4px 8px 10px; }
  .face {
    width: 32px; height: 32px; flex: none; border-radius: 7px; background: #222833;
    image-rendering: pixelated;  /* 像素頭像放大不要糊掉 */
  }
  .face.ph { display: grid; place-items: center; font-size: 15px; color: var(--dim); }
  .team {
    font-size: 11px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase;
    padding: 12px 8px 4px; display: flex; gap: 6px; align-items: baseline;
  }
  .team small { color: #4c525d; }
  .status { font-size: 11px; color: var(--dim); padding: 0 8px 10px; line-height: 1.7; }
  .status .warn { color: var(--accent); }

  main { display: flex; align-items: center; justify-content: center; background: #0b0d10; }
  main iframe { width: 100%; height: 100%; border: 0; }
  .placeholder { color: var(--dim); text-align: center; line-height: 2; }

  section { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .head .who { font-size: 16px; }
  /* 清全部：低調但【找得到】。第一版只有一個 14px、opacity .35 的裸圖示貼在角落，
     實際回報是「無法直接點擊」——其實點得到，是根本看不見。
     防誤按靠的是確認對話框，不是讓人找不到控制項；低調≠藏起來。 */
  .head .wipe { float: right; cursor: pointer; opacity: .6; font-size: 12px; color: var(--dim);
                border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .head .wipe:hover { opacity: 1; color: #e07070; border-color: #5a3a3a; }
  .head .task { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #2a2f3a; margin-left: 8px; }
  .badge.working { color: var(--accent); }
  .badge.ok { color: var(--ok); }
  .badge.error, .badge.lost { color: #e07070; }
  .badge.superseded, .badge.note { color: var(--dim); }   /* 不是失敗也不是進行中：別搶眼 */
.badge.stopped { color: #c9a227; }   /* 使用者自己喊停：沒做完，但不是壞掉——跟 ✗ 失敗分開 */
  /* 產出目錄：卡頭就給一個入口，不必展開才點得到 */
  /* 完整紀錄：每步一行，工具參數／結果用 pre 摺在固定高度內；失敗的標紅 */
  /* 收件匣：待處理在上（審批帶倒數與按鈕），最近在下；未讀粗體加點 */
  .inbox .irow { display: grid; grid-template-columns: 3.2em 4.5em 1fr auto auto; gap: 6px; align-items: center; font-size: 11.5px; padding: 3px 0; border-bottom: 1px dashed var(--line, #333); }
  .inbox .irow.todo { background: #2b2417; border: 1px solid #6d5a2a; border-radius: 6px; padding: 5px 6px; margin: 3px 0; }
  .inbox .iat, .inbox .ileft { color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
  .inbox .ileft.urgent { color: #c0392b; font-weight: 700; }
  .inbox .iwho { cursor: pointer; font-weight: 600; white-space: nowrap; }
  .inbox .iwhat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inbox .iwhat code { font-size: 10.5px; color: var(--dim); }
  .inbox .irow.bad .iwhat { color: #c0392b; }
  .inbox .irow.unread .iwhat::before { content: '●'; color: #e0a530; margin-right: 4px; font-size: 8px; }
  .inbox .irow:not(.todo) { cursor: pointer; }
  .inbox .ihint { color: var(--dim); font-size: 10.5px; grid-column: span 2; }
  .inbox button.yes, .inbox button.no { font-size: 11px; padding: 2px 8px; }
  /* 稽核帳本：一筆一行，時間／種類／對象；被拒、失敗、逾時標紅 */
  .audit .arow { display: grid; grid-template-columns: 7.5em 11em 1fr; gap: 6px; font-size: 11px; padding: 1px 0; }
  .audit .aat { color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
  .audit .akind { white-space: nowrap; }
  .audit .awhat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audit .arow.bad .akind { color: #c0392b; }
  /* 花費：每人每引擎一列；實花（cogito 美元）與換算（CLI 的 API 等值）分欄，不相加 */
  .costs table { border-collapse: collapse; font-size: 11px; width: 100%; }
  .costs th, .costs td { padding: 2px 6px; text-align: right; white-space: nowrap; }
  .costs th { color: var(--dim); font-weight: normal; }
  .costs th:first-child, .costs td:first-child, .costs th:nth-child(2), .costs td:nth-child(2) { text-align: left; }
  .costs td small { color: var(--dim); }
  .trace { margin: 6px 0 2px; border-top: 1px dashed var(--line, #ccc); padding-top: 6px; font-size: 11.5px; }
  .trace .thead { color: var(--dim); margin-bottom: 4px; }
  .trace .st { display: grid; grid-template-columns: 11em 1fr; gap: 6px; margin: 2px 0; }
  .trace .stm { color: var(--dim); font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trace pre { margin: 0; white-space: pre-wrap; word-break: break-all; max-height: 9em; overflow: auto; font-size: 10.5px; }
  .trace .st.bad pre { color: #c0392b; }
  .trace .st.thinking pre { color: var(--dim); font-style: italic; }
  .wdbtn { flex: none; cursor: pointer; opacity: .55; font-size: 13px; }
  .wdbtn:hover { opacity: 1; }
  /* 角色設定：預設收合，展開狀態記在 localStorage（想一直開著的人不用每次點） */
  /* 待審記憶提案：一條一列，動作貼右。刻意不做成表格——33 條的時候要能快速掃過去，
     而掃的是【那句話】，不是編號或欄位。 */
  .memo .row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 16px;
               border-top: 1px solid var(--line); font-size: 12px; line-height: 1.5; }
  .memo .row:hover { background: #1d212a; }
  .memo .n { color: var(--dim); flex: none; min-width: 22px; text-align: right; }
  .memo .txt { flex: 1; min-width: 0; }
  .memo .why { color: var(--dim); font-size: 11px; margin-top: 2px; }
  /* 會動到既有記憶的（UPDATE/DELETE）要看得出來：那不是「多記一件事」，是改掉或刪掉庫裡的東西 */
  .memo .row.destructive { border-left: 2px solid #d98a4a; }
  .memo .op { color: #d98a4a; font-size: 10px; border: 1px solid #4a3a28; border-radius: 4px;
              padding: 0 4px; margin-right: 4px; }
  .memo .acts { flex: none; display: flex; gap: 4px; }
  .memo .acts button { font-size: 11px; padding: 2px 7px; border-radius: 5px; cursor: pointer;
                       border: 1px solid var(--line); background: #232936; color: var(--fg); }
  .memo .acts button:hover { border-color: #6b7686; }
  .memo .bulk { padding: 8px 16px; display: flex; gap: 8px; align-items: center; }
  .memo .bulk .warn { color: var(--dim); font-size: 11px; margin-left: auto; }
  /* 動作的回饋要出現在【按鈕旁邊】。先前只寫到 composer 的 hint——那在右欄最底下，
     使用者在面板頂端按完根本看不到，失敗看起來就跟「按鈕沒反應」一模一樣（實際回報）。 */
  .memo .say { padding: 6px 16px 8px; font-size: 11px; color: var(--dim); }
  .memo .say.bad { color: #e07070; }
  .memo .say.busy { opacity: .7; }
  .prof { border-bottom: 1px solid var(--line); }
  .prof[hidden] { display: none; }
  .prof summary { cursor: pointer; padding: 8px 16px; font-size: 12px; color: var(--dim);
                  list-style: none; display: flex; gap: 6px; align-items: center; }
  .prof summary::-webkit-details-marker { display: none; }
  .prof summary:hover { color: var(--text); }
  .prof .body { padding: 2px 16px 14px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .prof .traits { color: var(--dim); font-size: 12px; line-height: 1.9; margin-bottom: 8px; }
  .prof .traits b { color: var(--text); font-weight: 500; }
  /* 看板：四欄橫排、窄欄就橫向捲。人不編輯它（卡片是 agent 移動的），所以沒有拖拉互動 */
  .board .cols { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; white-space: normal; }
  .board .col { flex: 1 0 128px; background: var(--panel2, #1b1e24); border-radius: 6px; padding: 6px; }
  .board .col > h4 { margin: 0 0 6px; font-size: 11px; color: var(--dim); font-weight: 500;
                     display: flex; justify-content: space-between; }
  .board .card { background: var(--panel, #23272e); border-radius: 4px; padding: 6px 7px;
                 margin-bottom: 5px; font-size: 12px; line-height: 1.45; }
  .board .card:last-child { margin-bottom: 0; }
  /* 欄色畫成【一條連貫的軌道】而不是每張卡各自的左邊框——後者被卡間距切成一段一段，
     讀起來像壞掉的虛線。軌道掛在卡片區上，所以它的長度剛好是「這欄有多少工作」，
     空欄自然沒有軌道（連 DOM 都不會產生），不必額外判斷。 */
  .board .col .track { border-left: 3px solid var(--line); padding-left: 7px; border-radius: 2px; }
  .board .col.doing .track { border-left-color: #5ea6e0; }
  .board .col.done .track { border-left-color: #76c47a; }
  .board .col.blocked .track { border-left-color: #e8c454; }
  .board .card .who { color: var(--dim); font-size: 11px; }
  /* 可跳轉的 owner：底線虛線提示「這是連結」，但不要做成按鈕——板子是唯讀的，
     這裡唯一的互動就是換人看 */
  .board .card .who.jump { cursor: pointer; border-bottom: 1px dashed var(--line); display: inline-block; }
  .board .card .who.jump:hover { color: var(--text); border-bottom-color: currentColor; }
  .board .card .dep { color: #e8c454; font-size: 11px; }
  .board .empty { color: var(--dim); font-size: 11px; padding: 4px 2px; }
  /* 會議進度：一排人名 + 回來了沒。刻意不做進度條——真實資料是離散的「誰回了」，
     畫成百分比反而是把已知的東西換成猜的 */
  .board .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .board .people .who { font-size: 12px; padding: 2px 8px; border-radius: 10px;
                        background: var(--panel2, #1b1e24); color: var(--dim); }
  .board .people .ok { color: #76c47a; }
  .board .people .bad { color: #e07070; }
  .board .people .wait { color: #e8c454; }
  /* 封存板：整塊再壓一階，而且左緣一條琥珀色的邊——「你正在看的是紀錄，不是現在」
     要用【看的】就分得出來，不能只靠標題那行字。 */
  .board.archived { border-left: 3px solid #6d5a2a; }
  .board.archived .cols { opacity: .78; }
  .prof .idle.arch { color: #c9a961; }
  .board .archlist { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .board .arow { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px; font-size: 12px;
                 border-radius: 6px; cursor: pointer; color: var(--dim); }
  .board .arow:hover { background: #1d212a; color: var(--text); }
  .board .arow.on { background: #232936; color: var(--accent); }
  .board .arow .when { flex: none; font-size: 11px; font-variant-numeric: tabular-nums; }
  .board .arow .n { margin-left: auto; flex: none; font-size: 11px; color: #6b7280; }
  /* 未在推進：整塊板降低存在感，「進行中」那欄的卡不再用亮色暗示有人在做 */
  .board .idle { color: #e8c454; font-size: 11px; }
  .board.stale .cols { opacity: .55; }
  .board.stale .col.doing .track { border-left-color: var(--line); }
  /* 工作區瀏覽：麵包屑 + 一層一層進資料夾，點檔案就地預覽 */
  .ws .crumb { font-size: 11px; color: var(--dim); padding: 2px 0 8px; word-break: break-all; }
  .ws .crumb b { color: var(--text); font-weight: 500; }
  .ws .row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-radius: 6px;
             cursor: pointer; font-size: 12.5px; }
  .ws .row:hover { background: #1d212a; }
  .ws .row.on { background: #232936; color: var(--accent); }
  .ws .row .sz { font-size: 11px; color: var(--dim); flex: none; }
  /* 改動時間：靠右、等寬數字（不對齊的話一整排時間會左右跳動，掃描起來很吵）。
     窄欄優先犧牲它而不是檔名——檔名才是找檔案的依據。 */
  .ws .row .tm { margin-left: auto; font-size: 11px; color: #6b7280; flex: none;
                 font-variant-numeric: tabular-nums; }
  .ws .row .tm.fresh { color: var(--accent); }   /* 這次任務剛動過的，一眼分得出來 */
  @media (max-width: 340px) { .ws .row .tm { display: none; } }
  /* git 鏡頭的摘要列：這一層在 worktree 裡時，先回答「跟我給他的版本比差在哪」 */
  .ws .gsum { font-size: 11px; color: var(--dim); padding: 4px 2px 6px; line-height: 1.6;
              border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .ws .gsum b { color: var(--accent); }
  .ws .gstat { color: #6b7280; }
  .ws .row.na { cursor: default; color: var(--dim); }
  .ws .row.na:hover { background: none; }
  /* 標題列的小控制項（↻ 重載、🗑 收掉）。選擇器掛在 .prof 而不是 .ws——任務板是
     .prof.board，之前只有 .ws 吃得到樣式，於是板上那兩顆完全沒有 margin-left:auto、
     沒有 hover 回饋，看起來就是標題的一部分，沒人知道那是可以點的。 */
  .prof summary .rl { margin-left: auto; opacity: .55; padding: 0 2px; cursor: pointer; }
  .prof summary .rl:hover { opacity: 1; color: var(--accent); }
  /* 兩顆並排時只有第一顆該吃掉剩餘空間，否則 🗑 會被推到離 ↻ 很遠 */
  .prof summary .rl ~ .rl { margin-left: 0; }
  /* 上 padding 移到第一個元素：sticky 標題釘在 top:0 時，上方那 12px 的縫（捲過去的內容會從那裡露出來，
     實際回報「標題後面有訊息滑動的影子」）就不存在了 */
  .feed { flex: 1; overflow-y: auto; padding: 0 16px 12px; }
  .feed > :first-child { margin-top: 12px; }
  .ev { margin-bottom: 10px; }
  @keyframes evin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .ev.in { animation: evin .28s ease-out; }
  .ev .at { font-size: 11px; color: var(--dim); }
  /* 協作模式的發言人名牌：低調到不搶內容，但一眼看得出這段話有主人 */
  .ev .who { font-size: 11px; color: #9aa4b2; margin: 1px 0 2px; }
  .ev .tx { white-space: pre-wrap; word-break: break-word; }
  .report { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; white-space: pre-wrap; word-break: break-word; }
  /* 程式碼：等寬、可橫向捲動（不換行才看得出縮排），語言標在右上角 */
  code { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tx code, .report code { background: #1b202a; border-radius: 4px; padding: 1px 5px; }
  pre.code { position: relative; background: #0f1319; border: 1px solid var(--line); border-radius: 8px;
             padding: 9px 11px; margin: 6px 0; overflow-x: auto; }
  pre.code code { background: none; padding: 0; display: block; white-space: pre; line-height: 1.55; }
  /* 單行長內容（審批卡的參數 JSON、一句 shell 指令）改用折行——它沒有縮排可以失去，
     橫向捲動在窄欄裡等於把後半藏起來（實際回報：審批參數看不完整）。多行程式碼維持不折。 */
  pre.code.wrap code { white-space: pre-wrap; word-break: break-all; }
  /* 長程式碼收合：工作串是對話，整份檔案貼進來會把上下文淹掉。摘要保留語言與行數，
     一眼知道折起來的是什麼、有多大，不用展開才知道要不要展開。 */
  .codewrap { margin: 6px 0; }
  .codewrap > summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px;
                        font-size: 11px; color: var(--dim); padding: 3px 8px;
                        border: 1px solid var(--line); border-radius: 6px; }
  .codewrap > summary::-webkit-details-marker { display: none; }
  .codewrap > summary::before { content: '▸'; }
  .codewrap[open] > summary::before { content: '▾'; }
  .codewrap > summary:hover { color: var(--text); }
  /* 語法高亮：低飽和配色，程式碼區塊本來就是深底，太鮮豔反而更難讀 */
  pre.code .cmt { color: #6b7280; font-style: italic; }
  pre.code .str { color: #98c379; }
  pre.code .num { color: #d19a66; }
  pre.code .kw  { color: #7aa2f7; }
  pre.code .key { color: #e5c07b; }
  pre.code .lang { position: absolute; right: 8px; top: 4px; font-size: 10px; color: var(--dim);
                   text-transform: uppercase; letter-spacing: .06em; }
  .tx strong, .report strong, .appr strong { font-weight: 600; color: #eef1f6; }
  .tx .h, .report .h, .appr .h { font-weight: 600; color: #eef1f6; font-size: 14.5px; }
  .tx .hr, .report .hr, .appr .hr { display: block; border-top: 1px solid var(--line); margin: 8px 0; }
  /* 日期分組：過去的每一天收成一條，點開才展開那天的卡 */
  .daybox { margin-bottom: 10px; }
  .daybox > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline;
                      padding: 5px 4px; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line); }
  .daybox > summary::-webkit-details-marker { display: none; }
  .daybox > summary:hover { color: var(--text); }
  .daybox > summary .dt { color: #9aa2ae; }
  .daybox > summary .cnt { margin-left: auto; font-size: 11px; color: #4c525d; }
  .daybox > summary .bad { color: #e07070; }
  .daybox > summary .del { opacity: 0; padding: 0 2px; cursor: pointer; transition: opacity .12s; }
  .daybox > summary:hover .del { opacity: .5; }        /* 平常藏起來：刪除鍵不該一直盯著你 */
  .daybox > summary .del:hover { opacity: 1; }
  .daybox[open] > summary { margin-bottom: 8px; }
  .daybox .dayitems { padding-left: 2px; }
  .tcard { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; background: var(--card); }
  .tcard summary {
    cursor: pointer; padding: 9px 12px; display: flex; align-items: center; gap: 8px;
    list-style: none; user-select: none;
  }
  .tcard summary::-webkit-details-marker { display: none; }
  /* 展開後標題列釘在頂端。工作串動輒幾十則，捲到中段想收起來就得先捲回去找標題——
     釘住之後隨時關得掉，狀態徽章、時間區間、📁 也一直留在視線內。
     只釘【直接子】summary：委派子卡也有 summary，一起釘會兩層互相蓋住。 */
  .tcard > summary { position: sticky; top: 0; z-index: 2; background: var(--card);
                     border-radius: 10px 10px 0 0; }
  /* 圓角缺口後面畫回 feed 底色：釘住時卡片內容從兩個角落露出來（elementFromPoint 打到 .tbody），
     這層在 summary 自己的堆疊裡墊底、又壓在內容上，缺口看到的就是 feed 底色，跟沒釘住時一樣 */
  .tcard > summary::before { content: ''; position: absolute; inset: 0 -1px; background: var(--bg); z-index: -1; }
  /* 分隔線從 .tbody 移上來：border-top 掛在內容上會跟著捲走，釘住的標題就失去下緣，
     變成一排字浮在另一排字上面。掛在 summary 才會跟著釘住的那一列走。 */
  .tcard[open] > summary { border-bottom: 1px solid var(--line); }
  .tcard summary .ttitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcard summary .trange { font-size: 11px; color: var(--dim); flex: none; }
  .tcard .badge { margin-left: 0; flex: none; }
  .tcard .tbody { padding: 4px 12px 10px; }
  .wd { font-size: 11px; color: var(--dim); padding: 6px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .wd:hover { color: var(--accent); text-decoration: underline; }
  /* 產出檔案：卡片展開後列出來，點一下就地預覽（圖片／PDF／純文字） */
  .files { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 2px; }
  .chip { font-size: 11px; color: var(--dim); background: #1b202a; border: 1px solid var(--line);
          border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: #3d4657; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .pv { margin: 6px 0 2px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0f1319; }
  .pv img { display: block; max-width: 100%; margin: 0 auto; }
  .pv iframe { display: block; width: 100%; height: 460px; border: 0; background: #fff; }
  /* 預覽的捲動【只發生在 .txt 這一層】：md 檔裡本來就可能有好幾個程式碼區塊，
     每塊各自捲的話會變成一頁好幾條捲軸（實際踩到）。內層只留長行的橫向捲動。 */
  .pv .txt { max-height: 460px; overflow: auto; }
    /* md 表格：spec/meeting 檔的任務拆解就是表格，不畫成表就是滿螢幕的 | */
    table.mdt { border-collapse: collapse; margin: 6px 0; font-size: .92em; }
    table.mdt th, table.mdt td { border: 1px solid var(--line); padding: 3px 8px;
      text-align: left; vertical-align: top; }
    table.mdt th { background: rgba(255,255,255,.05); font-weight: 600; }
  .pv .txt pre.code { margin: 6px 0; border: 0; max-height: none; overflow-x: auto; overflow-y: hidden; }
  .pv .txt > pre.code:first-child { margin-top: 0; }
  .sbar { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .sbar button { font: inherit; font-size: 11px; cursor: pointer; border: 1px solid #6d5a2a;
                 background: #2b2417; color: var(--accent); border-radius: 6px; padding: 2px 10px; }
  .shint { font-size: 11px; color: var(--dim); padding: 5px 8px; }
  .subcard { border-left: 2px solid #3a4356; margin: 6px 0 10px 6px; padding-left: 10px; background: #12161e; border-radius: 0 8px 8px 0; }
  .subcard summary { cursor: pointer; padding: 7px 8px 7px 0; display: flex; align-items: center; gap: 7px; list-style: none; }
  .subcard summary::-webkit-details-marker { display: none; }
  .subcard .sname { font-size: 13px; }
  .subcard .spreview { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subcard[open] .spreview { display: none; }
  .subcard .trange { font-size: 11px; color: var(--dim); flex: none; margin-left: auto; }
  .subcard .subbody { padding: 2px 0 8px 4px; }
  .face.sm { width: 22px; height: 22px; border-radius: 5px; }
  .composer { padding: 12px 16px; }   /* 上框線由 .hgrip 擔任 */
  /* 輸入框可以往上拉高：多行的任務描述在 62px 裡幾乎看不清楚（實際回報）。
     只開【垂直】——寬度歸側欄的拖曳桿管，兩套調寬的機制會互相打架。
     上限 45vh：再高就把工作串擠沒了，那是這個面板的主角。 */
  .composer textarea {
    width: 100%; background: #0f1115; border: 1px solid var(--line); border-radius: 8px;
    color: var(--dim); padding: 9px 12px; resize: vertical; font: inherit;
    height: 62px; min-height: 62px; max-height: 45vh;
  }
  .composer .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }
.composer .hint.err { color: #c0392b; font-size: 12px; font-weight: 600; }
/* 正在打字的那一行：閃爍游標，讓打字聲對得到位置 */
.typing::after { content: '▍'; color: var(--dim); animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
  /* 協作人數：只在選中看板時出現。放在輸入框【上方】而不是旁邊——它是這次任務的設定，
     不是送出動作的一部分，混進同一列會讓人以為要先選才能送。 */
  .crew { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap;
          color: var(--dim); margin-bottom: 8px; }
  /* display:flex 的特異度蓋過 hidden 屬性的 UA display:none——JS 一直有把 hidden 設對，
     但畫面照樣顯示（實際回報：選個別員工仍看到「參與人數」）。這行把 hidden 的話語權還回去。 */
  .crew[hidden] { display: none; }
  .crew label { white-space: nowrap; }   /* 側欄可以被拖窄，標籤斷成兩行會很醜 */
  .crew select, .crew input { background: #0f1115; color: var(--text); border: 1px solid var(--line);
                 border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; }
  .crew input { min-width: 16ch; flex: 1 1 16ch; }   /* 可搜尋的 repo 欄：窄欄下也還打得下字 */
  /* 說明自己佔一行：跟選單擠同一列的話，窄欄下兩邊都會折行 */
  .crew .note { color: #6b7280; flex-basis: 100%; font-size: 11px; }
  .crew .note:empty { display: none; }
  .composer textarea:not(:disabled) { color: var(--text); }
  /* 底部對齊而不是 stretch：輸入框可以被拉高，送出鈕不該跟著長成一大塊黃色。
     貼齊輸入框下緣，跟大多數聊天介面的手感一致。 */
  .inputrow { display: flex; gap: 8px; align-items: flex-end; }
  .inputrow textarea { flex: 1; }
  .inputrow button {
    border: 0; border-radius: 8px; padding: 0 18px; font: inherit; cursor: pointer;
    height: 62px; flex: none;
    background: var(--accent); color: #241c05;
  }
  .inputrow button:disabled { background: #2a2f3a; color: var(--dim); cursor: default; }
  .inputrow button.stop { background: #7a2f2f; color: #ffd9d9; }
  .empty { color: var(--dim); padding: 40px 16px; text-align: center; }
  .appr { background: #2b2417; border: 1px solid #6d5a2a; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .appr .tx { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  /* 結構化審批卡：標題列（警示＋工具 chip＋倒數）→ 參數 → 任務 ID → 按鈕。
     每一欄各司其職，要簽名的人掃一眼就知道「誰、要做什麼、還剩多久」——
     不再是一坨 markdown 原文靠運氣排版。 */
  .appr .ahead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .appr .ahead b { font-size: 13px; }
  .appr .tool { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: #201a10;
                color: #e8c454; border: 1px solid #6d5a2a; border-radius: 5px; padding: 2px 8px; }
  .appr .left { margin-left: auto; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .appr .left.urgent { color: #e07070; font-weight: 600; }
  .appr pre.code { margin: 0; }
  .appr .tid { font-size: 11px; color: var(--dim); margin-top: 6px; word-break: break-all; }
  .appr .btns { margin-top: 8px; display: flex; gap: 8px; }
  .appr button { border: 0; border-radius: 6px; padding: 5px 16px; font: inherit; cursor: pointer; }
  .appr .btns.hint { color: var(--dim); font-size: 12px; }
  .appr .yes { background: var(--ok); color: #10240f; }
  .appr .no { background: #3a2c2c; color: #e07070; }

/* ═══ 統一異常狀態 (anomaly_ui) — 四種異常同一種視覺語言 ═══
   顏色=嚴重度(L0灰/L1黃/L2橙/L3紅)，位置=影響範圍(橫幅=全域/角標=單一) */
.anomaly-banner{position:fixed;top:0;left:0;right:0;z-index:9999;
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  font:14px/1.4 system-ui;color:#e6edf3;border-bottom:2px solid;transition:opacity .25s;}
.anomaly-banner.hidden{display:none;}
.anomaly-banner .ab-icon{font-size:15px;}
.anomaly-banner .ab-msg{flex:1;}
.anomaly-banner .ab-action{padding:4px 12px;border-radius:4px;border:1px solid currentColor;
  background:transparent;color:inherit;cursor:pointer;font:inherit;}
.anomaly-banner .ab-action.hidden{display:none;}
.anomaly-banner[data-level="L0"]{background:#2a2f3a;border-color:#3a4553;color:#8aa0b4;}
.anomaly-banner[data-level="L1"]{background:#3a3320;border-color:#e0b83a;}
.anomaly-banner[data-level="L2"]{background:#3a2a1a;border-color:#e08a3a;}
.anomaly-banner[data-level="L3"]{background:#3a1f1f;border-color:#e05a5a;}
.npc-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;
  font-size:11px;text-align:center;line-height:16px;}
.npc-badge.L2{background:#e08a3a;color:#1a1200;}
</style>
</head>
<body>
  <!-- 統一異常橫幅：所有全域異常(L0-L3)都走 showAnomaly() 填這裡，不另畫 UI -->
  <div id="anomaly-banner" class="anomaly-banner hidden" data-level="">
    <span class="ab-icon"></span><span class="ab-msg"></span>
    <button class="ab-action hidden"></button>
  </div>
  <aside id="rail">
    <h1>員工<small id="count"></small></h1>
    <div id="status" class="status"></div>
    <div id="roster"></div>
    <!-- 先放一個佔位 summary：capcard() 取完資料才會覆蓋，在那之前空的 <details>
         會被畫成預設字樣「詳細資料」。它不像右欄那三塊可以先 hidden——這張卡是常駐的。 -->
    <details class="capcard" id="capcard"><summary>🛠 全員能力</summary></details>
  </aside>
  <div class="grip" id="gripL" title="拖曳調整名冊寬度（雙擊還原）"></div>
  <main id="stage"></main>
  <div class="grip" id="gripR" title="拖曳調整寬度（雙擊還原）"></div>
  <section>
    <div class="head" id="head"><div class="empty">點左側員工查看工作串</div></div>
    <!-- 三塊都預設 hidden：還沒選人時它們是空的，沒有 summary 的 <details> 會被瀏覽器
         畫成預設字樣「詳細資料」，右上角就浮出三條沒有意義的列。各自的 render 函式
         抓到資料才會取消 hidden。 -->
    <details class="prof ws" id="ws" hidden></details>
    <details class="prof board" id="board" hidden></details>
    <details class="prof inbox" id="inbox" hidden></details>
    <details class="prof memo" id="memo" hidden></details>
    <details class="prof" id="profile" hidden></details>
    <details class="prof audit" id="audit" hidden></details>
    <details class="prof costs" id="costs" hidden></details>
    <div class="feed" id="feed"></div>
    <div class="hgrip" id="gripB" title="拖曳調整輸入區高度（雙擊還原）"></div>
    <div class="composer">
      <div id="approvalCard" style="display:none"></div>
      <div class="crew" id="crew" hidden>
        <label for="crewN">參與人數</label>
        <select id="crewN">
          <option value="">自動（主持人自己判斷）</option>
        </select>
        <span class="note" id="crewNote"></span>
      </div>
      <div class="crew" id="engineRow" hidden>
        <label for="engineSel">引擎</label>
        <select id="engineSel">
          <option value="cogito">cogito（API 計費）</option>
          <option value="cli">Claude Code（訂閱額度）</option>
          <option value="codex">Codex（ChatGPT 訂閱）</option>
        </select>
        <span class="note" id="engineNote"></span>
      </div>
      <div class="crew" id="modelRow" hidden>
        <label for="modelSel">模型</label>
        <select id="modelSel"></select>
        <span class="note" id="modelNote"></span>
      </div>
      <div class="crew" id="repoRow" hidden>
        <label for="repoSel">工作 repo</label>
        <!-- 用 input+datalist 而不是 select：實測掃得到 288 個 repo，下拉選單在那個量級
             等於不能用（原生 type-ahead 只從開頭比對）。datalist 是瀏覽器原生的子字串
             過濾，打 "unity" 就出來，而且退化成純文字輸入框也還能用。 -->
        <input id="repoSel" list="repoList" placeholder="不綁定（沙箱作業）—— 打幾個字搜尋" autocomplete="off">
        <datalist id="repoList"></datalist>
        <select id="repoSort" title="候選的排列順序（進行中的一律置頂）">
          <option value="recent">最近動過</option>
          <option value="name">名稱</option>
        </select>
        <span class="note" id="repoNote"></span>
      </div>
      <div class="inputrow">
        <textarea id="box" disabled placeholder="先點左側員工，再描述任務…"></textarea>
        <button id="send" disabled>送出</button>
      </div>
      <div class="hint" id="hint">Enter 換行；按送出鈕才派工，1.6 秒內可按 Esc 取消（需 bot 開 COGITO_HTTP_ADDR）</div>
    </div>
  </section>
<script>
// ═══ 統一異常狀態模組 (anomaly) — 唯一入口，四種異常同一種語言 ═══
// 硬約束：零 LLM、只反映真實信號、不給假動作。斷線純自動退避(拍板)。
const ANOMALY_ICON = { L0:'\u27F3', L1:'\u26A0', L2:'\u25CF', L3:'\u26D4' };
function showAnomaly(level, msg, actionLabel, onAction){
  const b = document.getElementById('anomaly-banner');
  if (!b) return;
  b.dataset.level = level;
  b.querySelector('.ab-icon').textContent = ANOMALY_ICON[level] || '';
  b.querySelector('.ab-msg').textContent = msg;
  const btn = b.querySelector('.ab-action');
  if (actionLabel){ btn.textContent = actionLabel; btn.classList.remove('hidden'); btn.onclick = onAction || null; }
  else { btn.classList.add('hidden'); btn.onclick = null; }
  b.classList.remove('hidden');
}
function clearAnomaly(){ const b=document.getElementById('anomaly-banner'); if(b) b.classList.add('hidden'); }

// 後端健康探測：本前端是輪詢制(非WebSocket)，以輪詢 fetch 成敗判斷斷線。
// 指數退避概念套用到「連續失敗次數」：連續失敗中=L0(自動重試,無按鈕)，超門檻=L3(無按鈕,拍板不放手動鈕)。
let healthFails = 0;
function markBackendOk(){ if (healthFails>0){ healthFails=0; clearAnomaly(); } }
function markBackendFail(){
  healthFails++;
  if (healthFails <= 6) showAnomaly('L0', `\u9023\u7dda\u4e2d\u2026\uff08\u7b2c${healthFails}\u6b21\uff09`); // 連線中…(第N次) 無按鈕
  else showAnomaly('L3', '\u5f8c\u7aef\u9023\u4e0d\u4e0a\uff0c\u8acb\u7a0d\u5f8c\u91cd\u6574'); // 後端連不上，請稍後重整 無按鈕
}

const $ = id => document.getElementById(id);
let selected = null, agentsData = {};

// 左右兩欄都可拖寬：左＝名冊（能力卡展開時要看得清楚），右＝工作串。
// 用 pointer capture，游標拖過中間的 Unity 畫布也不會斷。
const RAIL_MIN = 180, RAIL_DEF = 232, DOCK_MIN = 280, DOCK_DEF = 400, STAGE_MIN = 380, GRIPS = 12;
const cssW = v => parseInt(getComputedStyle(document.documentElement).getPropertyValue(v)) || 0;
// 兩欄互相讓：任一邊的上限都是「扣掉對面與畫布保底之後剩下的」，所以拖到底也不會把畫布擠沒
const setRail = w => document.documentElement.style.setProperty('--rail',
  Math.min(Math.max(w, RAIL_MIN), Math.max(RAIL_MIN, innerWidth - GRIPS - cssW('--dock') - STAGE_MIN)) + 'px');
const setDock = w => document.documentElement.style.setProperty('--dock',
  Math.min(Math.max(w, DOCK_MIN), Math.max(DOCK_MIN, innerWidth - GRIPS - cssW('--rail') - STAGE_MIN)) + 'px');
setRail(+localStorage.railW || RAIL_DEF);
setDock(+localStorage.dockW || DOCK_DEF);

let dragging = null;   // 正在拖的把手設定（null＝沒在拖）
const endDrag = () => {
  if (!dragging) return;
  localStorage[dragging.key] = cssW(dragging.varName);
  dragging = null;
  document.body.classList.remove('dragging');
};
function bindGrip(id, opt) {
  const g = $(id);
  g.addEventListener('pointerdown', e => {
    e.preventDefault();
    g.setPointerCapture(e.pointerId);
    dragging = opt;
    document.body.classList.add('dragging');
  });
  g.addEventListener('pointermove', e => {
    if (!dragging) return;
    // e.buttons === 0 ＝ 按鍵早就放開了（在視窗外放手時 pointerup 不會回來）。
    // 沒這道判斷，游標之後只要「經過」黃線就會拖著寬度跑——按鍵沒按也在調整。
    if (!e.buttons) return endDrag();
    opt.set(opt.fromX(e.clientX));
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => g.addEventListener(ev, endDrag));
  g.addEventListener('dblclick', () => { opt.set(opt.def); localStorage[opt.key] = opt.def; });
}
// 橫向把手：拖那條線＝調整輸入框高度。
//
// 刻意【不】另外做一套「composer 高度」的狀態：輸入框自己的 resize 角把手已經在改
// box.style.height 了，再加一個各改各的高度，兩邊就會互相打架（拖線變高、拉角又跳回去）。
// 這裡改的是同一個值、存的是同一個 key——兩個入口，一份真相。
const BOX_DEF = '62px';
function setBoxH(px) {
  const box = $('box');
  const max = innerHeight * 0.45;      // 同 CSS 的 max-height：拉過頭會把工作串擠沒了
  box.style.height = Math.max(62, Math.min(px, max)) + 'px';
}
(() => {
  const g = $('gripB');
  let startY = 0, startH = 0;
  const end = () => {
    if (!document.body.classList.contains('vdragging')) return;
    document.body.classList.remove('vdragging');
    localStorage.boxH = $('box').style.height;
  };
  g.addEventListener('pointerdown', e => {
    e.preventDefault();
    g.setPointerCapture(e.pointerId);
    startY = e.clientY;
    startH = $('box').getBoundingClientRect().height;
    document.body.classList.add('vdragging');
  });
  g.addEventListener('pointermove', e => {
    if (!document.body.classList.contains('vdragging')) return;
    if (!e.buttons) return end();       // 同直向把手：在視窗外放手時 pointerup 不會回來
    setBoxH(startH + (startY - e.clientY));   // 往上拖＝輸入區變高
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => g.addEventListener(ev, end));
  g.addEventListener('dblclick', () => { setBoxH(62); localStorage.boxH = BOX_DEF; });
})();
bindGrip('gripL', { set: setRail, fromX: x => x, def: RAIL_DEF, key: 'railW', varName: '--rail' });
bindGrip('gripR', { set: setDock, fromX: x => innerWidth - x, def: DOCK_DEF, key: 'dockW', varName: '--dock' });
addEventListener('resize', () => { setRail(cssW('--rail')); setDock(cssW('--dock')); });

// 中間畫布：有 WebGL build 就嵌，沒有就提示
fetch('/unity/index.html', { method: 'HEAD' }).then(r => {
  $('stage').innerHTML = r.ok
    ? '<iframe src="/unity/index.html"></iframe>'
    : '<div class="placeholder">尚無 WebGL build<br>Unity 選單 Tools → Build WebGL (辦公室網頁版)<br>建置完重新整理本頁</div>';
}).catch(() => $('stage').innerHTML = '<div class="placeholder">後端未連線</div>');

// 能力圖卡：工具與技能是全員共用的（工具在各頻道各自 rooted，但掛的是同一組；
// 技能全 bot 讀同一份），所以整個辦公室一張卡，不是每位員工一份。
// 清單來自 cogito 本人（橋只轉發＋快取），不是寫死的表——工具是條件式掛載的。
async function capcard() {
  const box = $('capcard');
  // 帶上選到的人：清單照他的引擎回答（cogito／CLI 是兩個世界），沒選人就是 cogito 的全員清單
  const r = await (await fetch('/office/caps?agent=' + encodeURIComponent(selected || ''))).json();
  // 只在【內容真的變了】才重畫：這個面板會被輪詢，而重畫會清掉使用者展開的項目
  // 與搜尋框裡打到一半的字。同一份資料就別動 DOM（跟看板/工作區同一個做法）。
  const sig = r.ok ? [r.source || '', r.tools.length, r.skills.length, (r.mcp || []).length,
                      (r.tools[0] || {}).name, (r.tools[r.tools.length - 1] || {}).name].join('|')
                   : 'err:' + (r.error || '');
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  if (!r.ok) {
    box.innerHTML = `<summary>🛠 全員能力</summary><div class="err">${esc(r.error || '取不到')}</div>`;
    box.open = localStorage.capsOpen === '1';
    return;
  }
  const mcp = r.mcp || [];
  // 來源要標出來：cogito 與 CLI 的工具集完全不同（read_file/bash vs Read/Edit），
  // 不說清楚的話，看到一份不認得的清單只會更困惑。
  const who = selected && agentsData[selected] ? `（${esc(agentsData[selected].name)}）` : '';
  box.innerHTML = `<summary>🛠 能力${who}<small>工具 ${r.tools.length}・技能 ${r.skills.length}${
    mcp.length ? '・MCP ' + mcp.length : ''}</small></summary>`
    + (r.source ? `<div class="shint">來源：${esc(r.source)}</div>` : '');
  box.open = localStorage.capsOpen === '1';
  box.appendChild(capGroup('tools', '🛠 工具', r.tools));
  // MCP 單獨列：它們不在 registry 裡（模型透過 mcp_call_tool 呼叫），混在一起會誤導。
  // 再依 server 拆組——名稱本來就是 <server>__<tool>，一台一組才掃得動（實測 38 個）。
  if (mcp.length) {
    const byServer = new Map();
    for (const t of mcp) {
      const [srv, ...rest] = t.name.split('__');
      const short = rest.join('__') || t.name;
      (byServer.get(srv) || byServer.set(srv, []).get(srv)).push({ ...t, name: short });
    }
    const parent = capBox('mcp', '🔌 MCP', mcp.length);   // 各 server 收在這一層底下
    for (const [srv, list] of byServer) parent.appendChild(capGroup('mcp_' + srv, srv, list));
    box.appendChild(parent);
  }
  if (r.skills.length) box.appendChild(capGroup('skills', '📚 技能', r.skills));
  box.addEventListener('toggle', () => { localStorage.capsOpen = box.open ? '1' : '0'; });
}

// 一層收合盒（卡片內共用）：標題 + 計數，展開狀態記在 localStorage
function capBox(key, title, count) {
  const g = el('details', undefined, 'grp');
  g.open = localStorage['cap_' + key] === '1';
  g.innerHTML = `<summary>${esc(title)}<span class="n">${count}</span></summary>`;
  g.addEventListener('toggle', () => { localStorage['cap_' + key] = g.open ? '1' : '0'; });
  return g;
}

// 一組能力：預設收合、只顯示名稱；點某一項才展開它的說明。
// 超過 10 項再給搜尋框——工具接了 MCP 之後動輒二三十個，捲著找比打字慢。
function capGroup(key, title, items) {
  const g = capBox(key, title, items.length);
  const rows = [];
  for (const x of items) {
    const it = el('div', undefined, 'it');
    it.innerHTML = `<b>${esc(x.name)}</b>`;
    const desc = (x.description || '').split('\n')[0];
    if (desc) {
      it.appendChild(el('div', desc, 'd'));
      it.onclick = () => it.classList.toggle('open');
    }
    rows.push([x.name.toLowerCase() + ' ' + desc.toLowerCase(), it]);
    g.appendChild(it);
  }
  if (items.length > 10) {
    const find = el('input', undefined, 'find');
    find.placeholder = `在 ${items.length} 項中搜尋…`;
    find.oninput = () => {
      const q = find.value.trim().toLowerCase();
      for (const [hay, node] of rows) node.hidden = q && !hay.includes(q);
    };
    find.onclick = e => e.stopPropagation();
    g.insertBefore(find, g.querySelector('.it'));
  }
  return g;
}

async function roster() {
  try {
    const d = await (await fetch('/agents')).json();
    agentsData = d;
    const ids = Object.keys(d);
    $('count').textContent = ids.filter(id => d[id].npc !== false).length || '';   // 看板不是員工，別算人頭
    // 依 team 分組（persona 的 team 欄位；沒填的歸「未分組」，排最後）
    const teams = new Map();
    for (const id of ids) {
      const t = d[id].team || '未分組';
      (teams.get(t) || teams.set(t, []).get(t)).push(id);
    }
    // 「模式」（整組都沒有身體，例如看板）置頂：它是入口不是同事，藏在字母序中間很難找。
    const isMode = t => teams.get(t).every(id => d[id].npc === false);
    const ordered = [...teams.keys()].sort((a, b) =>
      (isMode(b) - isMode(a)) || (a === '未分組') - (b === '未分組') || a.localeCompare(b, 'zh-Hant'));
    $('roster').innerHTML = ordered.map(t => `
      <div class="team">${esc(t)}<small>${teams.get(t).length}</small></div>
      ${teams.get(t).map(id => {
        const a = d[id];
        return `<div class="emp ${id === selected ? 'sel' : ''}" onclick="pick('${id}')">
          <img class="face" src="/avatars/${id}.png" alt=""
               onerror="this.replaceWith(Object.assign(document.createElement('span'),
                        {className:'face ph', textContent:'${esc(a.name[0])}'}))">
          <span class="who"><div class="name">${esc(a.name)}</div><div class="role">${esc(a.role)}</div></span>
          <span class="state">${rosterState(a, id)}</span>
        </div>`;
      }).join('')}`).join('') || '<div class="empty">後端未載入名冊</div>';
    updateComposer();
    status();
    titleAlert();   // 有人在等審批就寫進分頁標題——這條不受自動播放政策影響
  } catch { $('roster').innerHTML = '<div class="empty">後端未連線</div>'; }
}

// 待審記憶提案面板：點名冊上的 💡 就展開，逐條放行或丟棄。
//
// 為什麼要有：提案是 cogito 的 consolidate 寫下來的「這次學到什麼」，要人點頭才進長期
// 記憶。先前【唯一】的入口是回聊天端下 `apply memory`——看板那 33 條就是這樣堆起來的：
// 看板不是真人的對話頻道，你平常根本不會去那裡。
//
// 動作一律轉給 cogito 執行（橋不自己搬檔案），所以 cogito 沒在跑時是【按不動】的，
// 這件事要在按之前就講，不要按了才發現。
async function memocard(id) {
  const box = $('memo');
  if (!id) { box.hidden = true; return; }
  // 以端點為準，不看 agentsData.memo：那份計數是 sweep 更新的，放行之後還會停在舊數字，
  // 用它當守門會讓面板在「已經清空」時仍舊顯示、或在剛歸零時提早關掉。
  const r = await (await fetch(`/office/proposed/${encodeURIComponent(id)}`)).json();
  if (!r.ok || !r.items.length) { box.hidden = true; return; }
  box.hidden = false;
  const rows = r.items.map(it => `
    <div class="row ${it.op ? 'destructive' : ''}">
      <span class="n">${it.n}.</span>
      <span class="txt">${it.op ? `<span class="op">${esc(it.op.toUpperCase())}</span>` : ''}${esc(it.text)}
        ${it.meta.length ? `<div class="why">${esc(it.meta.join('　'))}</div>` : ''}</span>
      ${r.can_apply ? `<span class="acts">
        <button onclick="memoAct('${id}', 'apply', [${it.n}])">放行</button>
        <button onclick="memoAct('${id}', 'reject', [${it.n}])">丟棄</button>
      </span>` : ''}
    </div>`).join('');
  box.innerHTML = `<summary>💡 待審記憶提案<small>${r.items.length} 條</small></summary>`
    + `<div class="say" id="memoSay"></div>`
    + (r.can_apply
        ? `<div class="bulk">
             <button onclick="memoAct('${id}', 'apply', [])">全部放行</button>
             <button onclick="memoAct('${id}', 'reject', [])">全部丟棄</button>
             <span class="warn">放行＝寫進長期記憶；丟棄不可復原</span>
           </div>`
        : `<div class="bulk"><span class="warn">cogito 沒在跑——提案存在它的工作區，`
          + `只有它能放行。這裡只能看。</span></div>`)
    + rows;
}

async function memoAct(id, verb, nums) {
  // 整批操作要先問一聲：33 條一次丟掉是回不來的。逐條就不問——那是使用者一條一條看過的判斷。
  if (!nums.length && !confirm(`確定要${verb === 'apply' ? '放行' : '丟棄'}全部提案嗎？`
                               + (verb === 'reject' ? '\n丟棄之後救不回來。' : ''))) return;
  // 回饋一律寫在面板【自己】的狀態列。先前只寫 composer 的 hint（右欄最底下），
  // 使用者在面板頂端按完看不到，於是失敗看起來就是「按鈕沒反應」（實際回報）。
  const say = (text, cls = '') => {
    const el = $('memoSay');
    if (el) { el.textContent = text; el.className = 'say ' + cls; }
    $('hint').textContent = text;    // 底下那行也留著：正在看下面的人一樣看得到
  };
  const btns = $('memo').querySelectorAll('button');
  btns.forEach(b => b.disabled = true);      // 送出中別讓人連按——每按一次都是一道真的指令
  say('送出中…', 'busy');
  let r;
  try {
    r = await (await fetch(`/office/proposed/${encodeURIComponent(id)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verb, nums }),
    })).json();
  } catch (e) {
    btns.forEach(b => b.disabled = false);
    return say(`送不出去：${e}`, 'bad');
  }
  if (!r.ok) {
    btns.forEach(b => b.disabled = false);
    return say(`✗ ${r.error}`, 'bad');       // 失敗要顯眼：一條都沒動，別讓人以為成功了
  }
  // cogito 是【非同步】收下的（202）：這一刻檔案還沒改完，立刻重抓會拿到舊清單。
  // 所以先講「處理中」，再排兩次重抓——真的改完了清單自己會少，不必猜要等多久。
  say(`已送出 ${r.sent}——cogito 處理中，清單稍後更新`);
  for (const ms of [2500, 8000]) setTimeout(() => { memocard(id); roster(); }, ms);
}

// 名冊列右側那格：他在做什麼 ＋ 有什麼在等你。
//
// 兩條軸【刻意分開】：頭上的徽章一次只掛得下一件事（有優先序），名冊有位子並排——
// 「他在等審批」跟「他還有 6 條提案沒人收」可以同時為真，擠成一個就得丟掉一個。
//
// 狀態文字對著橋的 want_emote() 回來的 badge，不在這裡另外判斷一次（同一份真相）。
const BADGE_TEXT = {
  alert: ['rate', '額度卡住'],
  warn:  ['rate', '額度快滿'],
  think: ['busy', '思考中'],
};

function openMemo(id) {
  pick(id);              // 面板是右欄的一部分，要先切到那個人才對得上
  const box = $('memo');
  box.hidden = false;
  box.open = true;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function rosterState(a, id) {
  // 等審批擺第一：它是唯一【非你不可】的狀態。timer_N 是倒數餅圖的格數（見橋的 want_emote）
  let dot, text;
  if (a.approval) [dot, text] = ['wait', '等審批'];
  else if (BADGE_TEXT[a.badge]) [dot, text] = BADGE_TEXT[a.badge];
  else if (a.busy) [dot, text] = ['busy', '工作中'];
  else [dot, text] = ['', ''];
  const state = `<span class="dot ${dot}"></span>${esc(text)}`;
  // 提案數獨立顯示：這是【看板那 33 條】唯一露得出來的地方——它沒有身體，
  // 頭上掛不了徽章（emote() 對 KANBAN 直接 return）。
  const memo = a.memo
    ? `<span class="memo" title="${a.memo} 條待審記憶提案——點開來逐條放行或丟棄"
             onclick="event.stopPropagation(); openMemo('${id}')">💡${a.memo}</span>`
    : '';
  // 有例行工作的人：一眼看得出誰是有班表的員工；細節在檔案卡
  const sched = a.scheduled ? `<span class="memo" title="${a.scheduled} 條班表——點開檔案卡看時間與交付">🗓</span>` : '';
  return state + memo + sched;
}

// 鏈路健康度：畫面凍結時（WebGL 分頁被瀏覽器暫停，WS 還開著）明講，別讓人猜 NPC 為何不動
async function status() {
  try {
    const s = await (await fetch('/office/status')).json();
    markBackendOk();  // 輪詢成功 = 後端活著，收掉斷線橫幅
    const canvas = !s.canvas ? '<span class="warn">🔴 畫面未連線</span>'
      : s.stale ? '<span class="warn">🟡 畫面無回應——重整分頁</span>'
      : `🟢 畫面已連線${s.canvas > 1 ? `（${s.canvas} 個）` : ''}`;
    const disp = s.dispatch ? '🟢 可派工' : '<span class="warn">🔴 派工未接（COGITO_HTTP）</span>';
    const blocked = !muted() && (!audio || audio.state !== 'running');
    const bell = `<span class="mute" title="${
      muted() ? '提示音已關（點我開啟）'
      : blocked ? '瀏覽器擋住音訊——點我解鎖（點 Unity 畫布不算互動）'
      : '提示音開著'}" onclick="toggleMute()">${muted() ? '🔕' : blocked ? '🔇' : '🔔'}</span>`;
    // 🎯 自動跟隨：打字聲跟著【真的長出來的字】走，但那些字可能在摺起來的卡裡或捲出畫面外——
    // 聽得到、找不到（實際回報）。開著時打字到哪就把卡展開、捲到看得見；關掉就維持原本的貼底跟捲。
    const eye = `<span class="mute" title="${follow() ? '自動跟隨開著：打字到哪就展開、捲到哪（點我關）' : '自動跟隨關著：只在貼底時跟捲（點我開）'}"
      onclick="toggleFollow()">${follow() ? '🎯' : '📍'}</span>`;
    // 打字速度：1×（預設）→ 2× → 即時 → 1×。有人覺得慢、有人要讀得下——給個鈕，不替所有人選一個。
    const sp = speed();
    const gauge = `<span class="mute" title="訊息打字速度：${sp === 0 ? '即時（不打字，整則直接出）' : sp + '×'}（點我切換 1× → 2× → 即時）"
      onclick="cycleSpeed()">${sp === 0 ? '⏩' : sp === 2 ? '⚡' : '🐢'}</span>`;
    // ⌨️ 打字聲自己一顆：有人要審批／完成的提示音、但嫌打字聲吵（實際回報）。🔕 仍是全部關掉
    const keys = `<span class="mute" title="${keysMuted() ? '打字聲已關（點我開啟；審批／完成的提示音不受影響）' : '打字聲開著（點我關掉；審批／完成的提示音照響）'}"
      onclick="toggleKeys()">${keysMuted() ? '🤫' : '⌨️'}</span>`;
    $('status').innerHTML = `${bell}${keys}${eye}${gauge}${canvas}<br>${disp}`;
  } catch { $('status').textContent = ''; markBackendFail(); }  // 輪詢失敗 = 觸發斷線分級(L0自動重試→L3)
}

const follow = () => localStorage.follow !== '0';   // 預設開：這是在修「聽得到找不到」，不是新花樣
// 打字速度倍率：1、2 或 0（即時）。存 localStorage，跟靜音、跟隨同一級的個人偏好。
const speed = () => { const v = parseInt(localStorage.speed ?? '1', 10); return [0, 1, 2].includes(v) ? v : 1; };
function cycleSpeed() { localStorage.speed = { 1: '2', 2: '0', 0: '1' }[speed()]; status(); }
function toggleFollow() { localStorage.follow = follow() ? '0' : '1'; status(); }
// 打字聲另外一個開關：跟 🔕（全部提示音）分開，關掉它不會漏掉審批。存 localStorage，跟靜音同一級的個人偏好。
const keysMuted = () => localStorage.keysMuted === '1';
function toggleKeys() { localStorage.keysMuted = keysMuted() ? '0' : '1'; status(); }

// 把正在打字的那一行弄成看得見：摺起來的祖先卡（含子卡）展開、捲到它在 feed 視窗內。
// 只在【看不見】時動手——看得見就什麼都不做，才不會跟使用者自己的捲動打架。
let approvalOpen = false;   // 選中的這位有審批卡開著（feed() 每輪更新）
function revealTyping(el) {
  if (approvalOpen) return;   // 審批中不跟隨：字照長，但畫面不追
  const f = $('feed');
  for (let d = el.closest('details'); d && f.contains(d); d = d.parentElement && d.parentElement.closest('details')) {
    if (!d.open) { d.open = true; if (d.dataset.id) tog(d.dataset.id, true); }
  }
  const r = el.getBoundingClientRect(), fr = f.getBoundingClientRect();
  if (r.bottom > fr.bottom - 8) f.scrollTop += r.bottom - fr.bottom + 24;
  else if (r.top < fr.top + 8) f.scrollTop -= fr.top - r.top + 24;
}

function toggleMute() {
  localStorage.muted = muted() ? '0' : '1';
  if (!muted()) { unlock(); cue('done'); }   // 開啟時試響一聲，順便解鎖音訊
  status();
}

// 等審批沒人理時每 60 秒再叫一次——HITL 有 5 分鐘逾時，錯過就自動拒絕了。
// 只在【有人真的在等】時才響，而且靠 /agents 的 approval 旗標判斷，不是自己記狀態。
setInterval(() => {
  if (Object.values(agentsData).some(a => a.approval)) cue('approval');
}, 60000);

// 忙碌時的 composer：不鎖輸入框——工作中打字是「插話」（糾正方向、不中止），
// 按鈕依內容切換：空＝中止、有字＝📨 插話。切換是看得見的（字樣＋顏色一起變），
// 不會發生「以為按中止結果送出插話」——想中止就把字清掉（Esc 或全選刪除）。
function updateComposer() {
  if (!selected) return;
  const a = agentsData[selected];
  const workingNow = !!(a && a.busy);
  const btn = $('send'), box = $('box');
  box.disabled = false;
  btn.disabled = false;
  const paint = () => {
    const steering = workingNow && box.value.trim();
    btn.textContent = workingNow ? (steering ? '📨 插話' : '中止') : '送出';
    btn.classList.toggle('stop', workingNow && !steering);
  };
  paint();
  box.oninput = paint;
  // 中止與插話都立刻生效（中止是反悔、插話搶的就是時機），只有派工走反悔窗
  btn.onclick = () => {
    const t = box.value.trim();
    if (!workingNow) return queueSend(box.value);
    return t ? steer(t) : dispatch('/stop');
  };
  // 看板不是人，措辭不能沿用派工那套：「派給這位員工」會讓人以為只有一個人在做，
  // 實際上它會開一場全隊會議、產出 spec、再分工。說清楚它會做什麼，比說它是誰重要。
  const isMode = a && a.npc === false;
  // 人數選項只給看板：其他人本來就是一個人做，給了只會讓人以為派工也能揪團。
  // 上限＝名冊實際人數，不寫死——加一位同事不該讓這個選單少一格。
  const crew = $('crew'), sel = $('crewN');
  crew.hidden = !isMode;
  if (isMode) {
    const team = Object.values(agentsData).filter(x => x.npc !== false).length;
    if (sel.options.length !== team + 1) {           // 名冊變了才重建，免得每輪把選擇洗掉
      const keep = sel.value;
      sel.length = 1;
      for (let n = 1; n <= team; n++) sel.add(new Option(`${n} 位`, String(n)));
      sel.value = keep;
    }
    if (!sel.dataset.bound) {                        // 記住選擇：同一種任務多半連著派好幾次
      sel.value = localStorage.crewN || '';
      sel.onchange = () => { localStorage.crewN = sel.value; updateComposer(); };
      sel.dataset.bound = '1';
    }
    sel.disabled = workingNow;
    $('crewNote').textContent = sel.value === '1'
      ? '一位＝不開會，直接請他給意見；spec 與板子照樣會寫'
      : sel.value ? '這是上限，人選仍由主持人判斷' : '';
  }
  box.placeholder = workingNow
    ? (isMode ? '⏳ 協作進行中——打字可「插話」給主持人糾正方向（不中止），或按「中止」停下整場'
              : `⏳ ${a.name} 工作中——打字可「插話」糾正方向（不中止），或按「中止」停下這件事`)
    : (isMode ? '描述一件要整隊完成的任務——會先開會、收斂成 spec，再分工…'
              : '描述任務派給這位員工…');
  // 工作 repo（Devin 對照筆記 ①）：入口資料驅動——OFFICE_REPOS_DIR 沒設就一個像素都不多
  const rr = $('repoRow'), rs = $('repoSel');
  rr.hidden = !reposList.length;
  if (reposList.length) {
    if (!rs.dataset.bound) {
      rs.oninput = () => updateComposer();     // 邊打邊更新提示（含「這個名字不存在」）
      rs.dataset.bound = '1';
    }
    rs.disabled = workingNow;
    const v = rs.value.trim();
    const hit = reposList.find(r => r.name === v);
    $('repoNote').textContent =
      !v ? ''
      : !hit ? `⚠ 沒有叫「${v}」的 repo——清單來自 ${reposList.length} 個本機專案，打幾個字會出現候選`
      : hit.bound ? '這位員工已經在這個 repo 上工作過——沿用同一個 worktree 與分支'
      : '會開一個新的 worktree 與 office/… 分支，成果 commit 在那裡——驗收後自己合併';
  }
  paintModelRow(a, workingNow);
  paintEngineRow(a, workingNow);
}

// 模型選單（觀察 ③：外殼要能臨時換模型）。清單與「目前實際會用哪個」都來自橋，前端不寫死
// 型號——cogito 不驗證 model id，打錯只會讓下個任務報錯燒掉一輪，所以給選單不給自由輸入。
let modelInfo = { models: [], reset: 'reset', effective: {} };
async function loadModels() {
  try { modelInfo = await (await fetch('/office/models')).json(); } catch { /* 拿不到就不畫 */ }
  if (selected) updateComposer();
}
loadModels();

function paintEngineRow(a, workingNow) {
  const row = $('engineRow'), sel = $('engineSel');
  row.hidden = !(modelInfo.cli || modelInfo.codex);   // 兩個 CLI 都找不到就一個像素都不多（入口資料驅動）
  if (row.hidden) return;
  for (const o of sel.options) {   // 找不到的引擎不給選（Claude Code 與 Codex 各自判斷）
    if (o.value === 'cli') o.hidden = !modelInfo.cli;
    if (o.value === 'codex') {
      // 裝了 Codex 但安全條件不符（沒有獨立 CODEX_HOME、沙箱被關）：選項留著但停用，把原因講出來，不讓人以為功能不見了
      o.hidden = !modelInfo.codex && !modelInfo.codex_blocked;
      o.disabled = !modelInfo.codex;
      o.textContent = modelInfo.codex ? 'Codex（ChatGPT 訂閱）' : 'Codex（未啟用）';
      o.title = modelInfo.codex_blocked || '';
    }
  }
  if (!sel.dataset.bound) {
    sel.onchange = () => updateComposer();
    sel.dataset.bound = '1';
  }
  let eff = modelInfo.engines?.[selected] || 'cogito';
  // cogito 沒開、CLI 在：預設不該指向一個派不出去的引擎（實際回報：看板送出「沒有反應」，
  // 其實是派給關著的 cogito 被拒）。這裡只改預設，選單仍可手動切回 cogito。
  const cogitoDown = modelInfo.cogito_up === false && modelInfo.cli;
  if (eff === 'cogito' && cogitoDown) eff = 'cli';
  if (sel.dataset.for !== selected) {   // 換人就跟著那個人目前生效的引擎
    sel.value = eff;
    sel.dataset.for = selected;
  }
  sel.disabled = workingNow;
  const cli = sel.value === 'cli';
  if (sel.value === 'codex') {
    // Codex：exec 模式沒有插話、沒有審批（沙箱外的操作直接失敗）——事先講清楚，不讓人按了才發現
    $('engineNote').textContent = `用 ${esc(modelInfo.codex_cmd || 'codex')} 跑（ChatGPT 訂閱）——可中止，暫不支援插話與審批`
      + (selected === 'kanban' ? '　⚠ 看板暫不支援 Codex' : '');
    paintCodexModelRow(workingNow);   // Codex 的型號跟 Claude 那份清單不同：換成 Codex 自己的清單
    return;
  }
  $('engineNote').textContent = (cli
    ? `用 ${modelInfo.cli_cmd || 'claude'} 跑（訂閱額度，不走 API 計費）——審批進辦公室、可插話，中止是直接砍掉行程`
      + (cogitoDown ? '　⚠ cogito 沒開，先走 CLI' : '')
    : (modelInfo.cogito_up === false ? '⚠ cogito 沒開——現在派給它會失敗，開了再派或改選 CLI' : ''))
    + (modelInfo.codex_blocked ? `　（Codex 未啟用：${modelInfo.codex_blocked}）` : '');
}

// Codex 的模型選單：清單來自 Codex 自己的 models_cache（依帳號方案過濾過）。選了會記住（跟 Claude 那份分開），「還原」收回。
// 沒選時實際跑哪個由橋決定：接續中的那條對話當初的模型 > OFFICE_CODEX_MODEL > Codex 預設——所以把「上次實際跑的」也講出來。
function paintCodexModelRow(workingNow) {
  const row = $('modelRow'), sel = $('modelSel');
  const list = modelInfo.codex_list || [];
  row.hidden = false;
  const eff = modelInfo.codex_effective?.[selected] || '', dflt = modelInfo.codex_default || '';
  const want = [['', dflt ? `Codex 預設（${dflt}）` : 'Codex 預設']]
    .concat(list.map(m => [m.id, m.name || m.id]));
  if (eff && !list.some(m => m.id === eff)) want.push([eff, eff]);   // 選過、但清單已經沒有的型號也要看得到
  if (eff) want.push([modelInfo.reset || 'reset', '↺ 還原 Codex 預設']);
  const sig = 'codex|' + selected + '|' + want.map(x => x[0]).join(',');
  if (sel.dataset.sig !== sig) {
    sel.innerHTML = want.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
    sel.dataset.sig = sig;
    sel.value = eff;   // 預選目前記住的那個，不是一律空白（否則選過之後畫面看不出來）
  }
  sel.disabled = workingNow;
  sel.onchange = () => updateComposer();
  const pick = sel.value, used = modelInfo.codex_models?.[selected];
  const desc = list.find(m => m.id === pick)?.description;
  $('modelNote').textContent =
    (pick === (modelInfo.reset || 'reset') ? '這次派工收回選過的模型，改用 Codex 預設'
     : pick && pick !== eff ? `這次派工改用 ${pick}——會記住，之後可選「還原」收回`
     : pick ? `目前會用 ${pick}`
     : '沒指定：接續中的對話沿用當初的模型，新對話用 Codex 預設')
    + (desc ? `（${desc}）` : '')
    + (used ? `　上次實際跑的是 ${used}` : '')
    + (list.length ? '' : '　（還沒拿到 Codex 的模型清單：先用 Codex 跑一次就會有）');
}

function paintModelRow(a, workingNow) {
  const row = $('modelRow'), sel = $('modelSel');
  // 這個人現在的引擎是 Codex：選單由 paintCodexModelRow 畫（它在引擎那排之後跑）。兩邊輪流重建會把使用者正在選的值洗掉。
  // 換人時引擎選單還沒跟上，所以用跟 paintEngineRow 同一套判斷。
  const es = $('engineSel');
  let eng = es.dataset.for === selected ? es.value : (modelInfo.engines?.[selected] || 'cogito');
  if (eng === 'cogito' && modelInfo.cogito_up === false && modelInfo.cli && es.dataset.for !== selected) eng = 'cli';
  if (eng === 'codex' && modelInfo.codex) return;
  // 三個引擎的型號互不相通，清單、記住的選擇、預設各自一份（2026-09-17 以前共用：cogito 改走 OpenAI 後，Claude Code 的選單裡是 GPT）
  const cli = eng === 'cli' && modelInfo.cli;
  const list = (cli ? modelInfo.cli_list : modelInfo.models) || [];
  row.hidden = !list.length;
  if (row.hidden) return;
  const reset = modelInfo.reset || 'reset';
  const picked = (modelInfo.picks?.[cli ? 'cli' : 'cogito'] || {})[selected] || '';
  const eff = (cli ? modelInfo.cli_effective : modelInfo.effective)?.[selected] || '';
  const persona = a.model || '';
  const personaOk = persona && (!cli || /^(claude|opus|sonnet|haiku)/i.test(persona));
  const dflt = cli ? (modelInfo.cli_default || '') : (modelInfo.cogito_default || '');
  const base = personaOk ? `跟人設（${shortModel(persona)}）`
    : cli ? `Claude Code 預設${dflt ? `（${shortModel(dflt)}）` : ''}`
    : `cogito 預設${dflt ? `（${dflt}）` : '（依 cogito 的設定）'}`;
  const want = [['', base]].concat(list.map(m => [m.id, m.name || shortModel(m.id)]));
  if (picked && !list.some(m => m.id === picked)) want.push([picked, picked]);   // 記住的、但清單已經沒有的也要看得到
  if (picked) want.push([reset, '↺ 還原預設']);
  const sig = (cli ? 'cli|' : 'cogito|') + selected + '|' + want.map(x => x[0]).join(',');
  if (sel.dataset.sig !== sig) {
    sel.innerHTML = want.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
    sel.dataset.sig = sig;
    sel.value = picked;   // 預選記住的那個（沒有就空白＝預設）——選過之後畫面要看得出來
  }
  sel.disabled = workingNow;
  sel.onchange = () => updateComposer();
  const pick = sel.value;
  const used = (cli ? modelInfo.cli_models : modelInfo.cogito_models)?.[selected];
  $('modelNote').textContent =
    (pick === reset ? `這次派工收回選過的模型，改用${personaOk ? '人設的' : '預設'}`
     : pick && pick !== picked ? `這次派工改用 ${shortModel(pick)}——會記住，之後可選「還原」收回`
     : eff ? `目前會用 ${shortModel(eff)}`
     : '目前用 cogito 自己的預設模型')
    + (used ? `　上次實際跑的是 ${shortModel(used)}` : '');
  // 降級要看得見：Claude Code 的清單不是官方那份時講出來
  if (cli && modelInfo.cli_source === 'local') $('modelNote').textContent += '　（問不到官方清單，這是本地後備）';
}

// 本機 repo 清單（橋掃 OFFICE_REPOS_DIR）。每次換人都重抓：bound 是【那位員工】有沒有
// 掛過這個 repo 的 worktree，人不同答案就不同。
let reposList = [];
async function loadRepos(aid) {
  const sel = $('repoSort');
  if (!sel.dataset.bound) {                       // 排序偏好記住：多數人只會選一次
    sel.value = localStorage.repoSort || 'recent';
    sel.onchange = () => { localStorage.repoSort = sel.value; loadRepos(selected); };
    sel.dataset.bound = '1';
  }
  try {
    const q = new URLSearchParams({ sort: sel.value });
    if (aid) q.set('agent', aid);
    reposList = (await (await fetch('/office/repos?' + q)).json()).repos || [];
  } catch { reposList = []; }
  // 後端排好序（進行中置頂、其餘依選擇）——datalist 依文件順序顯示，所以「還沒打字
  // 就看得到相關的那幾個」是免費的。標籤帶上狀態與時間：288 個同名前綴的專案裡，
  // 「哪個是我上週在動的」要有依據，不能靠記憶。
  $('repoList').innerHTML = reposList.map(r =>
    `<option value="${esc(r.name)}">${[r.bound ? '進行中' : '', r.mtime ? fileTime(r.mtime) : '']
      .filter(Boolean).join(' · ')}</option>`).join('');
  if (selected) updateComposer();
}
loadRepos('');

function pick(id) {
  selected = id;
  // 手動聚焦：點誰就把鏡頭鎖在誰身上。這是優先級最高的一級，而且只有這裡能解——
  // 你正在讀某個人的工作串時，鏡頭被別的事件搶走比不動更煩，那叫打斷。
  // 看板沒有身體（框不到），點它就等於解鎖回基態全景。
  fetch('/office/focus', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent: id }),
  }).catch(() => {});   // 鏡頭是錦上添花，連不上不該影響選人
  roster();
  updateComposer();
  loadRepos(id);   // 換人＝「已在進行中」的那組會變（worktree 是 per-員工 的）
  capcard();       // 換人＝引擎可能不同，能力清單跟著換
  // 順序有意義：上方三塊面板【先】定位，工作串最後畫。
  // 它們各自 await 自己的 fetch，誰先回來就誰先改 DOM——而 feed 是那個有彈性的元素，
  // 面板每落地一塊它就被擠一次。量過：先前切過去時 feed 高度在 60ms 內跳四次（579→615→
  // 573→245），看起來就是閃爍。讓面板先settle，feed 只需要重排一次。
  Promise.all([profile(id), board(id), workspace(id, ''), memocard(id)]).then(feed);
}

// 工作區瀏覽：agent 的產出不只在任務卡裡（有子目錄、有跨任務累積的檔案）。
// 路徑一律由橋鎖在該員工的工作區內，這裡只送相對路徑。
let wsPath = '';   // 目前看的相對路徑：重新載入與自動刷新都要回到同一層

// 看板面板：唯讀的四欄投影。只在「看板」那張卡上顯示——board.json 是協作模式的產物，
// 掛在別人身上沒有意義。人不拖卡片，所以這裡沒有任何互動，只有一顆 ↻（agent 寫檔時橋不會知道）。
let lastBoard = null;   // 上一次成功取得的快照：用來判斷「這次切過來會不會有板子」
// 封存清單：只在【真的有】封存時才出現。沒有封存的人（多數時候）看到的介面
// 跟以前一模一樣——這是「看得到歷史」與「介面乾淨」之間唯一不用取捨的做法：
// 入口的存在本身就是資料驅動的。
function archBtn(arch) {
  return arch.length ? `<span class="rl ar" title="看過去封存的板">🗄 封存 ${arch.length}</span>` : '';
}

const archWhen = (arch, file) => {
  const a = arch.find(x => x.file === file);
  return a ? new Date(a.mtime * 1000).toLocaleString('zh-TW',
    { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : file;
};

// 清單預設收著，按 🗄 才展開——九塊板一次全列出來就是把面板變成檔案總管。
function bindArch(box, id, arch) {
  const list = box.querySelector('.archlist');
  const btn = box.querySelector('.ar');
  if (!btn || !list) return;
  btn.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    if (list.children.length) { list.textContent = ''; return; }   // 再按一次＝收起來
    for (const a of arch) {
      const row = el('div', undefined, 'arow' + (a.file === viewArch ? ' on' : ''));
      row.append(el('span', archWhen(arch, a.file), 'when'),
                 document.createTextNode(a.task || a.file),
                 el('span', `${a.n} 卡`, 'n'));
      row.onclick = () => { viewArch = a.file; board(id); };
      list.appendChild(row);
    }
  };
}

// 正在看哪一塊【封存板】（''＝目前的活板）。收掉最後一塊之後整個面板會消失，
// 那些紀錄就等於被鎖在磁碟上——所以封存入口即使沒有活板也要開得了門。
let viewArch = '';

async function board(id) {
  const box = $('board');
  if (!agentsData[id] || agentsData[id].npc !== false) { box.hidden = true; return; }
  // 已經知道有板子，就【先把版面撐好】再去抓。等 fetch 回來才決定顯不顯示的話，右欄會在切換
  // 時多跳一次（量到 feed 高度 573→245 隔了一整幀），看起來就是閃一下。
  if (lastBoard) box.hidden = false;
  const r = await (await fetch('/office/board' + (viewArch ? `?f=${encodeURIComponent(viewArch)}` : ''))).json();
  const arch = r.archives || [];
  if (viewArch && !r.ok) { viewArch = ''; return board(id); }   // 那塊板被刪了：退回目前的板
  box.hidden = !r.ok && !arch.length;
  lastBoard = r.ok ? r : null;
  if (!r.ok) {
    // 沒有活板、但有封存：只畫一行入口。這是整個面板最樸素的狀態——
    // 有東西可看就別把門關上，但也別假裝有一塊板在跑。
    // 樣式要在【提早 return 之前】清掉。從封存板按「回到目前」會走到這條分支，
    // 標題換回來了、琥珀色左緣卻還在——看起來像還在看紀錄。
    box.classList.remove('archived', 'stale');
    const sig = 'arch:' + arch.map(a => a.file).join(',');
    if (box.dataset.sig !== sig || !box.children.length) {
      box.dataset.sig = sig;
      box.innerHTML = `<summary>🗂 任務板　<span class="idle">目前沒有進行中的板</span>
          ${archBtn(arch)}</summary><div class="body"><div class="archlist"></div></div>`;
      bindArch(box, id, arch);
      box.open = localStorage.boardOpen !== '0';
    }
    return;
  }
  // 內容沒變就不要重畫：推進中每一則事件都會呼叫這裡，每次都重建 innerHTML 就是持續閃爍。
  const sig = JSON.stringify(r);
  if (box.dataset.sig === sig && box.children.length) return;
  box.dataset.sig = sig;
  // 預設【展開】——人設/工作區那兩個面板是附屬資訊所以預設收合，看板不是：協作模式下它就是
  // 主角，每次都要手動展開等於沒做。只有使用者自己收起來過（存成 '0'）才維持收合。
  const wasOpen = box.open || localStorage.boardOpen !== '0';
  // 還沒上板：畫【會議進度】而不是空板子。上板前的會議是最久也最貴的一段，
  // 那段時間任務板全空，使用者只能看著工作串捲、不知道還要等多久、誰還沒回。
  if (r.mode === 'meeting') {
    box.dataset.sig = '';   // 換回真板子時要能重畫
    // 全員交件、板子還沒出現＝主持人在寫逐字稿與規格。那段時間畫面上六個人坐在會議室
    // 不動、卡片全是已完成，看起來像散會了沒走。狀態本身是真的，講出來就不會被誤讀。
    // （3D 那邊表達不了：NPCSprite 的 action 只有一個插槽，送 phone 會蓋掉坐姿，人會站起來。）
    const wrap = r.done === r.total
      ? `<span class="idle">${r.done}/${r.total} 都交件了，主持人整理中</span>`
      : `<span class="idle">${r.done}/${r.total} 已回</span>`;
    box.innerHTML = `<summary>🗂 任務板｜會議進行中　${wrap}
        <span class="rl" title="重新載入">↻</span></summary>
      <div class="body"><div class="people"></div></div>`;
    box.querySelector('.rl').onclick = e => { e.preventDefault(); e.stopPropagation(); board(id); };
    box.open = box.open || localStorage.boardOpen !== '0';
    const p = box.querySelector('.people');
    for (const x of r.people) {
      const mark = x.done ? (x.ok ? '✓' : '✗') : '…';
      p.appendChild(el('span', `${mark} ${x.name}`, 'who ' + (x.done ? (x.ok ? 'ok' : 'bad') : 'wait')));
    }
    return;
  }

  // 圖示與名詞都要跟上面那張人設卡分開——兩個「📋 看板」並排，沒人分得出誰是誰。
  // 「未在推進」要講出來：board.json 只有主持人在跑時才更新，它收工後「進行中」那欄會停在
  // 原地，畫面上看起來有人在做、實際沒有。投影寧可顯得樸素，也不能說謊。
  // 看封存板時措辭要換掉：它不是「未在推進」（那是活板停擺），是一份【已經結束的紀錄】。
  // 也不給 🗑——封存板沒有「收掉」這回事，按了只會去動到活板。
  box.innerHTML = `<summary>🗂 ${r.archived ? '封存板' : '任務板'}${r.task ? '｜' + esc(r.task.slice(0, 40)) : ''}
      ${r.archived ? `<span class="idle arch">🗄 ${esc(archWhen(arch, r.archived))} 的紀錄</span>`
                   : r.live ? '' : '<span class="idle">⏸ 未在推進</span>'}
      <span class="rl" title="重新載入">↻</span>
      ${r.archived ? '<span class="rl back" title="回到目前的板">↩ 回到目前</span>'
                   : '<span class="rl clr" title="收掉這塊板（改名封存在工作區，不會真的刪掉）">🗑 收掉</span>'}
      ${archBtn(arch)}</summary>
    <div class="body"><div class="archlist"></div><div class="cols"></div></div>`;
  const acts = [['.rl', () => board(id)]];
  acts.push(r.archived ? ['.back', () => { viewArch = ''; board(id); }] : ['.clr', clearBoard]);
  for (const [sel, fn] of acts)
    box.querySelector(sel).onclick = e => {
      e.preventDefault(); e.stopPropagation();   // 不要順手把面板收起來
      fn();
    };
  bindArch(box, id, arch);
  box.open = wasOpen;
  box.classList.toggle('stale', !r.live);
  box.classList.toggle('archived', !!r.archived);
  // ontoggle 而非 addEventListener：這個函式每收到一則事件就重跑一次，addEventListener 會愈疊愈多
  box.ontoggle = () => {
    localStorage.boardOpen = box.open ? '1' : '0';
    // 展開就重抓。事件驅動的更新有兩個前提——面板是【開著的】而且選中的就是看板本人；
    // 收起來的那段時間主持人換了幾塊板，展開時看到的還是上一輪的殘影。
    // 實測踩過：畫面上是訪客那塊板，磁碟上早就換成 board-memory-review.json 了。
    if (box.open) board(selected);
  };
  const cols = box.querySelector('.cols');
  for (const c of r.columns) {
    const col = el('div', '');
    col.className = 'col ' + c.key;
    const h = el('h4', '');
    h.appendChild(el('span', c.name));
    h.appendChild(el('span', String(c.cards.length)));
    col.appendChild(h);
    if (!c.cards.length) col.appendChild(Object.assign(el('div', '—'), { className: 'empty' }));
    const track = Object.assign(el('div', ''), { className: 'track' });
    if (c.cards.length) col.appendChild(track);
    for (const card of c.cards) {
      const d = el('div', '');
      d.className = 'card';
      d.appendChild(el('div', card.title));
      if (card.owner) {
        const w = Object.assign(el('div', '👤 ' + card.owner), { className: 'who' });
        // 有對到人就讓它可以跳過去：板子回答「誰在做什麼」，工作串回答「他到底做了什麼」，
        // 兩者之間本來就該一步到位。對不到人的（owner 是自由文字）維持純文字，
        // 不要做出一個點了沒反應的東西。
        if (card.owner_id) {
          w.classList.add('jump');
          w.title = `看 ${card.owner} 的工作串`;
          w.onclick = () => pick(card.owner_id);
        }
        d.appendChild(w);
      }
      // 等待相依時把「在等誰」寫出來——只標「等待中」等於沒說，看板的價值就在這條邊
      if (c.key === 'blocked' && card.deps.length)
        d.appendChild(Object.assign(el('div', '⏳ 等 ' + card.deps.join('、')), { className: 'dep' }));
      track.appendChild(d);
    }
    cols.appendChild(col);
  }
}

// 檔案時間的措辭：一小時內講「幾分鐘前」，今天講時分，更早講月/日。
// 為什麼不一律給完整時間戳——工作區大多是【剛剛才產出】的東西，「3 分鐘前」比
// 「08/27 18:50」更快回答「這是不是這次任務做的」。完整時間放 title，滑上去看得到。
const FRESH_MS = 10 * 60 * 1000;   // 十分鐘內＝這一輪剛動過（標黃）

// git 狀態的中文化。用字要能直接回答「這個檔案怎麼了」——M/A/D 對讀 git 的人夠了，
// 但工作區面板的讀者是老闆，不是每個人都天天看 porcelain。
const GIT_MARK = { M: '改過', A: '新增', D: '刪除', R: '改名', C: '複製', '?': '新檔（未加入）' };
const GIT_TITLE = { M: '這個檔案被修改過', A: '新增的檔案（已 git add）', D: '被刪掉了',
                    R: '改了名字', C: '複製自別的檔案', '?': '新檔案，還沒 git add' };
const isFresh = t => t && Date.now() - t * 1000 < FRESH_MS;

function fileTime(t) {
  if (!t) return '';
  const d = new Date(t * 1000), diff = Date.now() - d;
  if (diff < 60_000) return '剛剛';
  if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} 分前`;
  if (d.toLocaleDateString('sv') === today())
    return d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  return d.toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
}

async function workspace(id, path) {
  const box = $('ws');
  const r = await (await fetch(`/office/ws/${id}?p=${encodeURIComponent(path)}`)).json();
  box.hidden = !r.ok;
  if (!r.ok) return;
  wsPath = path;
  const wasOpen = box.open || localStorage.wsOpen === '1';
  // ↻：agent 剛寫完檔案時，這個面板不會自己知道（它只在換人時抓一次）
  box.innerHTML = `<summary>📂 工作區${path ? '｜' + esc(path) : ''}
      <span class="rl" title="重新載入">↻</span></summary>
    <div class="body"><div class="crumb"></div><div class="rows"></div>
    <div class="pv" style="display:none"></div></div>`;
  box.querySelector('.rl').onclick = e => {
    e.preventDefault(); e.stopPropagation();   // 不要順手把面板收起來
    workspace(id, wsPath);
  };
  box.open = wasOpen;
  box.querySelector('.crumb').innerHTML =
    `<b>${esc(r.root)}</b>${path ? ' / ' + esc(path) : ''}　${r.entries.length} 項`;
  // git 鏡頭：這一層在掛進來的 worktree 裡時，問題不是「什麼時候改的」而是「改了什麼」。
  // （mtime 在這裡本來就不可信：worktree checkout 會把每個檔案的 mtime 蓋成當下。）
  if (r.git) {
    const g = r.git;
    const sum = el('div', undefined, 'gsum');
    sum.innerHTML = g.note
      ? `🔗 ${esc(g.repo)}｜${esc(g.branch || '（無分支）')}　<i>${esc(g.note)}</i>`
      : `🔗 ${esc(g.repo)}｜${esc(g.branch)}　改了 <b>${g.total}</b> 個檔`
        + (g.commits ? `　${g.commits} 個 commit` : '　<i>尚未 commit</i>')
        + (g.stat ? `<div class="gstat">${esc(g.stat)}　（對照出發點 ${esc(g.base)}）</div>` : '');
    box.querySelector('.body').insertBefore(sum, box.querySelector('.crumb'));
  }
  const rows = box.querySelector('.rows'), pv = box.querySelector('.pv');
  if (r.up !== null && r.up !== undefined) {
    const up = el('div', '⬆︎ 上一層', 'row');
    up.onclick = () => workspace(id, r.up);
    rows.appendChild(up);
  }
  for (const e of r.entries) {
    const size = e.dir ? '' : (e.size / 1024).toFixed(1) + 'K';
    const row = el('div', undefined, 'row' + (e.kind === 'raw' ? ' na' : ''));
    // worktree 內換 git 欄：檔案標自己的狀態、資料夾標底下改了幾個檔；沒改動的留白
    // ——留白才看得出哪幾個有動（每一列都標等於沒標）。
    const tm = r.git
      ? el('span', e.git ? (GIT_MARK[e.git] || e.git) : e.git_n ? `${e.git_n} 個改動` : '',
           'tm' + (e.git || e.git_n ? ' fresh' : ''))
      : el('span', fileTime(e.mtime), 'tm' + (isFresh(e.mtime) ? ' fresh' : ''));
    tm.title = r.git
      ? (e.git ? GIT_TITLE[e.git] || e.git : e.git_n ? `這個資料夾底下有 ${e.git_n} 個檔案有改動` : '沒有改動')
      : (e.mtime ? new Date(e.mtime * 1000).toLocaleString() : '');
    row.append(el('span', e.dir ? '📁' : e.kind === 'image' ? '🖼' : e.kind === 'pdf' ? '📕' : '📄'),
                document.createTextNode(e.name), tm, el('span', size, 'sz'));
    if (e.dir) row.onclick = () => workspace(id, e.path);
    else if (e.kind !== 'raw') row.onclick = () => showFile(pv, rows, row, e,
      `/office/wsfile/${id}?p=${encodeURIComponent(e.path)}`);
    rows.appendChild(row);
  }
  box.addEventListener('toggle', () => { localStorage.wsOpen = box.open ? '1' : '0'; });
}

// 角色設定（persona 欄位 + personas/<id>.md）。只在換人時抓一次——它不會即時變，
// 掛在每 8 秒的 poll 裡只會把使用者展開的面板一直重畫。
async function profile(id) {
  const box = $('profile');
  box.hidden = true;
  const r = await (await fetch(`/office/profile/${id}`)).json();
  if (!r.ok) return;
  box.hidden = false;
  box.open = localStorage.profOpen === '1';
  const icon = agentsData[id] && agentsData[id].npc === false ? '📋' : '👤';   // 模式不是人
  box.innerHTML = `<summary>${icon} ${esc(r.name)}｜${esc(r.role || '—')}｜${esc(r.team || '—')}</summary>
    <div class="body"><div class="traits"></div></div>`;
  const t = box.querySelector('.traits');
  for (const [k, v] of [['個性', r.personality], ['說話風格', r.style], ['習慣', r.habits]]) {
    if (!v) continue;
    t.appendChild(el('b', k + '：'));
    t.appendChild(document.createTextNode(v));
    t.appendChild(document.createElement('br'));
  }
  // 班表：這個人有什麼例行工作。資料就是 schedule.json 與防重戳記，畫面不另存——
  // 先前完全不在畫面上，老闆要知道誰幾點做什麼只能去讀檔。
  if (r.schedule && r.schedule.length) {
    t.appendChild(el('b', '🗓 班表：'));
    for (const j of r.schedule) {
      const bits = [j.when, j.name, j.engine ? j.engine.toUpperCase() : '依外殼引擎'];
      if (j.deliver) bits.push('交付 ' + j.deliver);
      bits.push(j.last ? '上次 ' + j.last.slice(5) + ' 時' : '還沒跑過');
      t.appendChild(el('span', bits.map(esc).join(' · ')));
      const go = el('span', ' ▶ 現在跑', 'wdbtn'); go.title = '手動跑這條班表（今天已有報表就不重跑）';
      go.onclick = (e) => { e.stopPropagation(); runJob(j.name); };
      t.appendChild(go);
      t.appendChild(document.createElement('br'));
    }
  }
  if (r.soul) {
    const soul = el('div');
    box.querySelector('.body').appendChild(soul);
    renderBody(soul, r.soul, false);
  }
  box.addEventListener('toggle', () => { localStorage.profOpen = box.open ? '1' : '0'; });
  auditcard(id);
}

// 收件匣：老闆該處理的事，一個面板。右欄一次只給一個人的串，三個人同時做事就是在三條串之間切——
// 跟盯三個終端沒兩樣（實際回報）。這裡只列需要老闆的事：審批與看板等開工（現在就要），
// 收工／失敗／被擋／交付（看一眼就好）。已讀是老闆這個人的事，不是辦公室的事實，存瀏覽器。
const inboxRead = () => parseInt(localStorage.inboxRead || '0', 10);
async function inboxcard() {
  const box = $('inbox');
  if (!box) return;
  let r;
  try { r = await (await fetch('/office/inbox?limit=40')).json(); } catch { return; }
  if (!r.ok) return;
  // 清除：老闆說「這些我不用再看」——藏到這個序號為止，之後新來的照常出現。是老闆的偏好不是辦公室的事實，存瀏覽器；
  // 帳本本身一筆不少（要真的收起來是稽核面板的「封存」）。
  const hide = parseInt(localStorage.inboxHide || '0', 10);
  r.recent = r.recent.filter(x => x.seq > hide);
  const top = Math.max(r.max_seq || 0, ...r.recent.map(x => x.seq || 0));   // 水位：橋給的與畫面上最新一筆取大，兩邊都不信單一來源
  const dismissed = new Set((localStorage.inboxDismiss || '').split(',').filter(Boolean));
  r.todo = r.todo.filter(t => !(t.kind === 'missed' && dismissed.has(t.id)));
  const unread = r.recent.filter(x => x.seq > inboxRead()).length;
  const sig = JSON.stringify([r.todo.map(t => t.id), r.recent.slice(0, 40).map(x => x.id), unread]);
  if (box.dataset.sig === sig) { tickInbox(); return; }   // 沒變就不重畫（跟能力面板同一個做法）
  box.dataset.sig = sig;
  box.hidden = !(r.todo.length || r.recent.length);
  if (box.hidden) return;
  box.innerHTML = `<summary>📥 收件匣<small>${r.todo.length ? `待處理 ${r.todo.length}・` : ''}未讀 ${unread}</small>
    ${r.todo.filter(t => t.kind === 'missed').length > 1 ? `<span class="wdbtn" title="今天到點沒跑的班表全部補跑（今天已有報表的不重跑）" onclick="event.preventDefault(); event.stopPropagation(); runJob('');">▶ 補跑全部</span>` : ''}
    <span class="wdbtn" title="全部標為已讀" onclick="event.preventDefault(); event.stopPropagation(); localStorage.inboxRead = String(${top}); inboxcard();">✓ 全讀</span>
    ${r.recent.length ? `<span class="wdbtn" title="把「最近」清掉（只影響你這個瀏覽器；帳本一筆不少）" onclick="event.preventDefault(); event.stopPropagation(); localStorage.inboxHide = String(${top}); localStorage.inboxRead = String(${top}); inboxcard();">🗑 清除</span>` : ''}</summary>`;
  box.open = localStorage.inboxOpen !== '0';   // 預設開：這是主面板
  for (const t of r.todo) {
    const row = el('div', '', 'irow todo');
    if (t.kind === 'approval') {
      const btns = t.from
        ? `<span class="ihint">↩︎ 來自 ${esc(t.from)}，請回原平台核准</span>`
        : `<button class="yes" onclick="event.stopPropagation(); dispatchFor('${t.agent}', 'approve')">核准</button>
           <button class="no" onclick="event.stopPropagation(); dispatchFor('${t.agent}', 'reject')">駁回</button>`;
      row.innerHTML = `<span class="ileft" data-left="${t.left_s}" data-t0="${Date.now()}"></span>
        <span class="iwho" onclick="pick('${t.agent}')">${esc(t.name)}</span>
        <span class="iwhat">⏳ 審批 <b>${esc(t.tool)}</b> <code>${esc((t.params || '').slice(0, 90))}</code></span>${btns}`;
    } else if (t.kind === 'missed') {
      // 橋在到點時沒開著：補不補是老闆的決定。今天那份已經在了橋會拒（fire_job 守門），不會重跑
      row.innerHTML = `<span class="ileft"></span><span class="iwho" onclick="pick('${t.agent}')">${esc(t.name)}</span>
        <span class="iwhat">🗓 ${esc(t.text)}</span>`;
      // 班表名稱帶中文、id 帶日期與引號：不能塞進 onclick="…" 字串——JSON 的雙引號會把屬性截斷，
      // 整顆鈕變成語法錯誤、按了沒反應（實際回報）。用事件綁定，值不經過 HTML。
      const go = document.createElement('button'); go.className = 'yes'; go.textContent = '▶ 補跑';
      go.onclick = e => { e.stopPropagation(); runJob(t.job); };
      const no = document.createElement('button'); no.className = 'no'; no.title = '今天不補了，別再列'; no.textContent = '✕';
      no.onclick = e => { e.stopPropagation(); localStorage.inboxDismiss = (localStorage.inboxDismiss || '') + ',' + t.id; inboxcard(); };
      row.append(go, no);
    } else {
      row.innerHTML = `<span class="ileft"></span><span class="iwho" onclick="pick('${t.agent}')">${esc(t.name)}</span>
        <span class="iwhat">🗓 ${esc(t.text)}</span>
        <button class="yes" onclick="event.stopPropagation(); dispatchFor('${t.agent}', '開工。照板子推進，先做相依都滿足的票，最多 3 人並行。')">開工</button>`;
    }
    box.appendChild(row);
  }
  for (const x of r.recent) {
    const row = el('div', '', 'irow ' + (x.sev || '') + (x.seq > inboxRead() ? ' unread' : ''));
    row.append(el('span', (x.at || '').slice(11, 16), 'iat'),
               el('span', x.name, 'iwho'),
               el('span', x.text, 'iwhat'));
    row.title = '點開這個人的工作串' + (x.card ? `（卡 ${x.card}）` : '');
    row.onclick = () => { pick(x.agent); if (x.card) openCard(x.agent, x.card); };
    box.appendChild(row);
  }
  box.addEventListener('toggle', () => { localStorage.inboxOpen = box.open ? '1' : '0'; });
  tickInbox();
}
function tickInbox() {   // 審批倒數：橋給剩餘秒數，這裡往下數
  for (const el_ of document.querySelectorAll('#inbox .ileft[data-left]')) {
    const s = Math.max(0, Math.round(+el_.dataset.left - (Date.now() - +el_.dataset.t0) / 1000));
    el_.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    el_.classList.toggle('urgent', s < 60);
  }
}
setInterval(tickInbox, 1000);
// 手動跑班表：name 空＝今天到點沒跑的全部。橋回每條的結果（開跑／今天已有／人在忙）
async function runJob(name) {
  const r = await (await fetch('/office/schedule/run', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(name ? { name } : {}) })).json();
  const msg = !r.ok ? `⛔ ${r.error}` : !r.results.length ? '今天沒有漏跑的班表'
    : r.results.map(x => `${x.name}：${x.ok ? '開跑 ✓' : x.error}`).join('；');
  $('hint').textContent = msg; $('hint').classList.toggle('err', !r.ok);
  inboxcard(); roster();
}
// 給指定的人下指令（收件匣裡放行別人的審批，不必先切到他）
async function dispatchFor(agent, text) {
  const r = await (await fetch('/office/dispatch', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent, text }) })).json();
  $('hint').textContent = r.ok ? `已送給 ${esc(agentsData[agent]?.name || agent)} ✓` : `⛔ 失敗：${r.error}`;
  $('hint').classList.toggle('err', !r.ok);
  inboxcard(); roster();
}
// 跳到某人的某張卡：切人後等 feed 畫好，把那張卡展開、對齊到頂
async function openCard(agent, cid) {
  for (let i = 0; i < 40; i++) {
    const el_ = $('feed').querySelector(`.tcard[data-id="${cid}"]`);
    if (el_ && $('feed').dataset.agent === agent) { el_.open = true; tog(cid, true); stuck = false; alignTop(el_); return; }
    await sleep(100);
  }
}

// 稽核帳本：這位員工最近的裁決（審批被問／放行／駁回／逾時、政策拒絕、權限被擋、插話、中止、交付）
// 加整條鏈的驗證結果。工作串是可覆寫的投影，這本是 append-only、hash 鏈——證得了沒被動過。
const AUDIT_ICON = { 'task.start': '📋', 'task.done': '✔', 'task.stopped': '⏹', 'approval.asked': '⏳', 'approval.approved': '✓',
  'approval.rejected': '✗', 'approval.timeout': '⏰', 'policy.denied': '⛔', 'permission.denied': '⛔', 'steer': '📨',
  'delivery.sent': '📤', 'delivery.failed': '⚠' };
async function auditcard(id) {
  const box = $('audit');
  if (!box) return;
  let r;
  try { r = await (await fetch(`/office/audit?agent=${encodeURIComponent(id)}&limit=20`)).json(); }
  catch (e) { r = { ok: false, error: e.message }; }
  if (!r.ok || !r.items.length) { box.hidden = true; return; }
  box.hidden = false;
  const v = r.verify || {};
  const chain = v.ok ? `鏈完整・共 ${v.entries} 筆` : `⚠ 鏈在第 ${v.broken_at} 筆斷了：${v.reason || ''}`;
