  box.innerHTML = `<summary>🧾 稽核帳本<small>${r.items.length} 筆・${esc(chain)}</small>
    <span class="wdbtn" title="封存整本（全員）：改名歸檔、不刪，新本第一筆記下上一本的檔名與最後 hash" onclick="event.preventDefault(); event.stopPropagation(); archiveLedger('${id}');">📦 封存</span></summary>`;
  box.open = localStorage.auditOpen === '1';
  for (const e of r.items) {
    const what = e.tool || e.task || e.target || e.text || e.why || e.reason || e.detail || '';
    const row = el('div', '', 'arow' + (/denied|rejected|failed|timeout|stopped/.test(e.kind) ? ' bad' : ''));
    row.append(el('span', (e.at || '').slice(5, 16).replace('T', ' '), 'aat'),
               el('span', `${AUDIT_ICON[e.kind] || '·'} ${e.kind}`, 'akind'),
               el('span', String(what).slice(0, 120), 'awhat'));
    row.title = JSON.stringify(e, null, 1);
    box.appendChild(row);
  }
  box.addEventListener('toggle', () => { localStorage.auditOpen = box.open ? '1' : '0'; });
}

// 花費：最近 N 天每人每引擎。cogito 是真實美元；CLI 走訂閱、只有 token 與「換算成 API 約多少」——
// 兩欄分開、不相加、不冒充實花。材料是稽核帳（含封存本），橋不另外記一份。
async function costcard() {
  const box = $('costs');
  if (!box) return;
  const days = parseInt(localStorage.costDays || '7', 10);
  let r;
  try { r = await (await fetch(`/office/costs?days=${days}`)).json(); } catch { return; }
  if (!r.ok) return;
  const sig = JSON.stringify([days, r.total, r.rows.length]);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.hidden = !r.rows.length;
  if (box.hidden) return;
  const by = new Map();   // 面板一眼看「人＋引擎」合計；按日的細節放在列的 title
  for (const x of r.rows) {
    const k = x.agent + '|' + x.engine;
    const a = by.get(k) || { name: x.name, engine: x.engine, tasks: 0, usd: 0, api_equiv: 0, tok_in: 0, tok_out: 0, tok_cache: 0, est: false, days: [] };
    a.tasks += x.tasks; a.usd += x.usd; a.api_equiv += x.api_equiv; a.tok_in += x.tok_in; a.tok_out += x.tok_out; a.tok_cache += x.tok_cache; a.est = a.est || x.est;
    a.days.push(`${x.date.slice(5)}：${x.tasks} 件${x.usd > 0 ? `・實花 $${x.usd.toFixed(4)}` : ''}${x.api_equiv > 0 ? `・換算 ~$${x.api_equiv.toFixed(2)}` : ''}`);
    by.set(k, a);
  }
  const money = v => v > 0 ? '$' + v.toFixed(v < 1 ? 4 : 2) : '';
  const kk = n => !n ? '' : n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n);
  const rows = [...by.values()].sort((a, b) => (b.usd + b.api_equiv) - (a.usd + a.api_equiv)).map(a =>
    `<tr title="${esc(a.days.join('\n'))}"><td>${esc(a.name)}</td><td>${esc(a.engine.toUpperCase())}</td><td>${a.tasks}</td>` +
    `<td>${a.usd > 0 ? (a.est ? '~' : '') + money(a.usd) : ''}</td>` +
    `<td>${a.tok_in || a.tok_out ? `${kk(a.tok_in)}／${kk(a.tok_out)}${a.tok_cache ? ` <small>快取 ${kk(a.tok_cache)}</small>` : ''}` : ''}</td>` +
    `<td>${a.api_equiv > 0 ? '~' + money(a.api_equiv) : ''}</td></tr>`).join('');
  box.innerHTML = `<summary>💰 花費<small>最近 ${days} 天・${r.total.tasks} 件・cogito 實花 ${money(r.total.usd) || '—'}・CLI 換算 ${r.total.api_equiv > 0 ? '~' + money(r.total.api_equiv) : '—'}${r.cap_usd ? `・cogito 單次上限 $${r.cap_usd}` : ''}</small>
    <span class="wdbtn" title="切換統計天數" onclick="event.preventDefault(); event.stopPropagation(); localStorage.costDays = String(${days === 7 ? 30 : 7}); $('costs').dataset.sig = ''; costcard();">${days === 7 ? '看 30 天' : '看 7 天'}</span></summary>
    <table><tr><th>員工</th><th>引擎</th><th>件</th><th title="cogito 算好的真實美元；~ 表示該模型沒登記單價、是估的">實花</th><th title="CLI 走訂閱：token 進／出，另列快取">token</th><th title="Claude Code 自報的 total_cost_usd：換算成 API 會是多少，訂閱並不會這樣扣">換算</th></tr>${rows}</table>`;
  box.open = localStorage.costOpen === '1';
  box.addEventListener('toggle', () => { localStorage.costOpen = box.open ? '1' : '0'; });
}
async function archiveLedger(id) {
  if (!confirm('把整本稽核帳本封存？舊本改名保留在 backend/audit/，畫面與收件匣的「最近」會清空。')) return;
  const r = await (await fetch('/office/audit/archive', { method: 'POST' })).json();
  $('hint').textContent = r.ok ? `已封存 ${r.entries} 筆 → ${r.archived}` : `⛔ ${r.error}`;
  $('hint').classList.toggle('err', !r.ok);
  localStorage.inboxHide = '0'; localStorage.inboxRead = '0';   // 新本序號從 1 起，舊的藏匿水位要歸零
  auditcard(id); inboxcard(); $('costs').dataset.sig = ''; costcard();
}

// 送出前的反悔窗。派工是【不可逆】的——一旦進了 cogito 就開始花錢，也沒有「收回」這回事，
// 只能 /stop（那時前面的步驟已經跑過了）。所以真正能反悔的位置只有【還沒送出去之前】。
// 記住輸入框被拉成多高。純視覺偏好，放 localStorage 就好（跟提示音靜音同一級）。
// 用 ResizeObserver 而不是監聽拖曳：使用者也可能用鍵盤或瀏覽器手勢改大小。
addEventListener('DOMContentLoaded', () => {
  const box = $('box');
  if (localStorage.boxH) box.style.height = localStorage.boxH;
  new ResizeObserver(() => {
    if (box.style.height) localStorage.boxH = box.style.height;
  }).observe(box);
});

const SEND_GRACE = 1600;   // ms：夠按到 Esc，又不會讓人覺得卡住
let pendingSend = null;    // {timer, text}

function cancelSend() {
  if (!pendingSend) return false;
  clearTimeout(pendingSend.timer);
  $('box').value = pendingSend.text;   // 原文放回去，游標接著改
  $('box').disabled = false;
  $('box').focus();
  pendingSend = null;
  $('hint').textContent = '已取消，回到編輯 ✎';
  return true;
}

// 排一次送出：先清空輸入框（讓人看得出「已經收下了」），但真正的呼叫延後到反悔窗結束。
// 不先送再想辦法撤回——撤不回來的東西，介面就不該假裝撤得回來。
function queueSend(text) {
  if (!selected || !text.trim() || pendingSend) return;
  // repo 打到一半就按送出：當場擋下。讓它跑完 1.6 秒反悔窗再被橋回一句錯，
  // 是白等一輪——而且那時輸入框已經清空了，得重打。
  const rv = $('repoSel').value.trim();
  if (rv && !reposList.some(r => r.name === rv)) {
    $('hint').textContent = `沒有叫「${rv}」的 repo——清空表示不綁定，或從候選裡選一個`;
    $('repoSel').focus();
    return;
  }
  const box = $('box');
  pendingSend = { text: box.value, timer: 0 };
  box.value = '';
  box.disabled = true;
  $('hint').textContent = '即將送出…（Esc 取消）';
  pendingSend.timer = setTimeout(() => {
    const t = pendingSend.text;
    pendingSend = null;
    box.disabled = false;
    dispatch(t);
  }, SEND_GRACE);
}

// 目前選的人數（null＝自動）。看板以外一律 null——橋那邊也會再擋一次，
// 兩邊都擋是因為這個值會變成給主持人的指令，送錯對象就是憑空多一段話。
function crewN() {
  const a = agentsData[selected];
  if (!a || a.npc !== false) return null;
  const v = parseInt($('crewN').value, 10);
  return Number.isFinite(v) ? v : null;
}

// 插話：塞一句話給【進行中】的任務糾正方向（cogito 下一輪生效），不打斷正在跑的那一步。
// 不走反悔窗——插話搶的就是時機，1.6 秒後才送等於看著它再走錯一步。
async function steer(text) {
  const r = await (await fetch('/office/dispatch', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent: selected, text: '/steer ' + text }),
  })).json();
  $('hint').textContent = r.ok ? '已插話 📨 下一輪生效——不打斷正在跑的那一步' : `插話失敗：${r.error}`;
  if (r.ok) { $('box').value = ''; updateComposer(); feed(); }
}

async function dispatch(text) {
  if (!selected || !text.trim()) return;
  const r = await (await fetch('/office/dispatch', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent: selected, text: text.trim(), people: crewN(),
                           repo: $('repoSel').value.trim() || null,
                           model: $('modelSel').value || null,
                           engine: $('engineSel').value || null }),
  })).json();
  // 失敗要看得見：先前只有 11px 的灰字，實際回報「按了送出沒有反應」——其實是 cogito 沒開、派工被拒，
  // 但那行字跟平常的提示長得一樣。失敗改紅字並把原因講完；成功照舊。
  $('hint').textContent = !r.ok ? `⛔ 派工失敗：${r.error}`
    : text.trim() === '/stop' ? '已中止 🛑' : '已交辦 ✓';
  $('hint').classList.toggle('err', !r.ok);
  if (r.ok) { $('box').value = ''; loadModels(); feed(); }
}

// 開啟產出資料夾：路徑不從這裡送，只給卡號讓橋自己查（橋端不做任意路徑開啟器）
// 跳到上方固定的 📂 工作區面板：展開、捲到可見。面板本身在換人時已載入根目錄；
// 若使用者先前逛到子目錄，維持原路徑不重設（他要的是「回去看檔案」，不是「回根目錄」）。
function jumpWs() {
  const box = $('ws');
  if (box.hidden) { $('hint').textContent = '這位員工還沒有工作區'; return; }
  box.open = true;
  localStorage.wsOpen = '1';
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Enter 不再送出——textarea 的預設行為就是換行，所以這裡【不攔】它。
// 派工的代價比一則訊息高得多（開任務、走位、花錢），而 Enter 是打字時最容易誤觸的鍵：
// 多行的需求描述打到一半就被送出去過。送出一律走按鈕。
//
// Esc 綁在 document 而不是輸入框上：反悔窗期間輸入框是 disabled 的，鍵盤事件到不了它身上。
addEventListener('keydown', e => { if (e.key === 'Escape') cancelSend(); });

// 模型 id 太長會把時間欄擠爆（claude-opus-5 / claude-haiku-4-5-20251001…），
// 取後面認得出來的那截。完整 id 放 title，滑過去看得到——縮寫不能變成猜謎。
const shortModel = id => String(id).replace(/^(claude|gpt|gemini)-/, '').replace(/-\d{8}$/, '');

const BADGE = { working: '⏳ 進行中', ok: '✔ 已完成', error: '✗ 失敗', lost: '⚠ 失聯',
                stopped: '🛑 已中止', superseded: '↻ 已由續跑接手', note: '· 雜記' };

// 展開狀態：進行中的任務自動展開（要看得到即時進度），完成後【維持展開】——
// 使用者往往還沒讀完就結束了。手動收起就尊重他；重新整理後歷史卡一律收合。
const opened = new Set(), closed = new Set();
function shouldOpen(t) {
  if (closed.has(t.id)) return false;             // 使用者手動收起最大，之後不再自動撐開
  if (t.status === 'working') opened.add(t.id);   // 進行中自動展開，而且【黏住】——
  return opened.has(t.id);                        // 任務跑完也不自動收（使用者還沒看完）
}
const tog = (id, open) => open
  ? (opened.add(id), closed.delete(id))
  : (opened.delete(id), closed.add(id));

// 手動開合一張卡＝「我要看這張卡」，不是「我要追即時輸出」。
// 兩件事一起做，缺一不可：
//   ① 關掉自動跟捲。卡多半就在底部，展開前 stuck 是 true，內容一長出來下一次
//      keepBottom() 就 scrollTop = scrollHeight——使用者看到的是「點一下直接跳到最後」。
//      釘住的標題列救不了這個：它釘的是位置，救不了被甩走的視窗。
//   ② 把卡頂對齊到 feed 的內容頂端，也就是 sticky 標題列釘住的那個位置——
//      展開後第一眼看到的是卡頭與開頭幾則，然後自己慢慢往下捲。
// 要回到跟捲，捲回底部就好（scroll 事件會把 stuck 設回 true）。
function alignTop(el) {
  const f = $('feed');
  const pad = parseFloat(getComputedStyle(f).paddingTop) || 0;
  f.scrollTop += el.getBoundingClientRect().top - f.getBoundingClientRect().top - pad;
  // ⚠ 捲動事件是【非同步】的：它會在這行之後才跑，用對齊【後】的位置重算 stuck。
  // 對齊如果剛好落在底部 40px 內，跟捲就被偷偷打開了——短卡、串尾的卡、以及【每一次
  // 收合】（feed 縮短，必然貼底）都會踩到。下一次 keepBottom() 就又把人甩到最底部，
  // 症狀正是「開一次好好的，關掉再開就失效」。所以捲完再關一次。
  requestAnimationFrame(() => { stuck = false; });
}

// WebKit 在 <details> 開合之後【不會重算】sticky 的約束：第一次展開時釘得住，關掉再開
// 就變成普通元素跟著內容捲走（Chromium 不受影響，我在 Chromium 上重現不出來）。
// 把 position 拿掉、強制一次 reflow、再放回去，逼它重新計算。同一幀內完成、不會有閃爍，
// 對沒這個問題的瀏覽器也只是多一次 layout。
function nudgeSticky(el) {
  const sum = el.querySelector(':scope > summary');
  sum.style.position = 'static';
  void sum.offsetHeight;          // 這行不能省：不讀一次版面就不會真的重算
  sum.style.position = '';
}

// details 的開合改由 click 接管：toggle 事件是非同步的，程式自動開合會被誤記成使用者意圖
function bindToggle(el, id, t) {
  el.querySelector('summary').addEventListener('click', ev => {
    ev.preventDefault();
    el.open = !el.open;
    tog(id, el.open);
    stuck = false;
    if (el.open) nudgeSticky(el);
    alignTop(el);
  });
}

// 串流佇列：同一輪可能一次收到好幾則事件（工具→結果→回報），排隊【一則接一則】浮現，
// 不要全部同時開始打字——那看起來就是「一次冒出好幾則」，沒有串流感。
const queue = [];
let draining = false, gen = 0;
function enqueue(job) {
  queue.push(job);
  if (!draining) drain();
}
async function drain() {
  draining = true;
  try {
    while (queue.length) {

const KW = {
  python: 'def class return if elif else for while import from as try except finally with lambda None True False and or not in is pass raise yield assert async await global del',

function inlineFmt(box, text) {

      inlineFmt(span, h[2]);
      box.appendChild(span);
    } else if (li) {
      box.appendChild(document.createTextNode(li[1] + '• '));
      inlineFmt(box, li[2]);
    } else {
      inlineFmt(box, line);
    }
    if (i < lines.length - 1) box.appendChild(document.createTextNode('\n'));
  }
}

// 補回被截斷的語法符號：橋為了控制長度會截字（審批卡 300、訊息 200、工具參數 120），
// 常常砍在反引號中間——沒補的話後半段整片原文外洩，正是「還是看得到 markdown」的來源。
function closeFences(t) {
  if ((t.match(/```/g) || []).length % 2) t += '\n```';
  if ((t.replace(/```/g, '').match(/`/g) || []).length % 2) t += '`';
  return t;
}

// animate=false 時整段同步渲染（沒有 await，呼叫端可以當同步用）
// 工作串裡超過這個行數的程式碼區塊預設收起來。
// 為什麼要有門檻而不是一律收：三五行的小修改就地看到最好，收起來反而多一次點擊；
// write_file 一次貼進來上百行才是「對話被檔案內容淹沒」的元凶。
const CODE_FOLD_LINES = 8;

async function renderBody(box, text, animate, foldCode = false) {
  box.textContent = '';
  for (const seg of segments(closeFences(text))) {
    if (seg.code) {
      const lines = seg.v.split('\n').length;
      const fold = foldCode && lines > CODE_FOLD_LINES;
      let host = box;
      if (fold) {
        const d = el('details', undefined, 'codewrap');
        d.appendChild(el('summary', `${seg.lang || '程式碼'} · ${lines} 行`));
        box.appendChild(d);
        host = d;
      }
      const pre = el('pre', undefined, 'code');
      if (!seg.v.trim().includes('\n')) pre.classList.add('wrap');   // 單行＝折行，見 CSS 註解
      if (seg.lang) pre.appendChild(el('span', seg.lang, 'lang'));
      const code = el('code');
      pre.appendChild(code);
      host.appendChild(pre);
      keepBottom();
      // 新到的程式碼逐字浮現（看 agent 把檔案「寫出來」）；補歷史時直接上字。
      // 收起來的就別演了——沒人看得到，只是白等。
      if (animate && !fold) await typewrite(code, seg.v); else code.textContent = seg.v;
      highlight(code, seg.v, seg.lang);   // 打完字才上色（打字中反覆重建 DOM 會閃）
      continue;
    }
    const span = el('span');
    box.appendChild(span);
    if (animate) {
      await typewrite(span, plainOf(seg.v));   // 打字階段就不帶語法符號
      span.textContent = '';                   // ⚠ markdown() 是【附加】不是覆蓋——不先清空，
    }                                          //   打好的純文字會留著，整段字就出現兩次
    markdown(span, seg.v);                     // 打完換上樣式；plainOf 保證字數一致，畫面不會跳
  }
}

// 時間標籤：今天的卡只顯示時刻，跨天的補上日期——一整串卡累積下來，
// 只有 HH:MM 根本分不出是哪一天處理的。舊卡沒有 day 欄位，就維持原樣只顯示時刻。
const today = () => new Date().toLocaleDateString('sv');   // sv 剛好是 YYYY-MM-DD
function when(t) {
  const span = t.at + (t.end ? '–' + t.end : '');
  if (!t.day || t.day === today()) return span;
  const [, m, d] = t.day.split('-');
  return `${+m}/${+d} ${span}`;
}

// 依完成日分組：今天的任務直接攤在外面（你正在做的事不該還要點一下），
// 過去的每一天收成一組，點開才看得到——一週下來上百張卡，攤平就沒法用了。
// 日期不明的舊卡（沒有 day 欄位）另收一組排在最上面。
function dayBox(feed, t) {
  const day = t.day || '';
  if (day === today()) return feed;              // 今天：不進分組，直接掛在 feed 底下
  let box = feed.querySelector(`:scope > .daybox[data-day="${day}"]`);
  if (box) return box.querySelector('.dayitems');
  box = el('details', undefined, 'daybox');
  box.dataset.day = day;
  const [, m, d] = day ? day.split('-') : [];
  box.innerHTML = `<summary><span class="dt">${day ? `${+m}/${+d}` : '更早（日期不明）'}</span>
      <span class="cnt"></span><span class="del" title="清掉這一天的紀錄">🗑</span>
    </summary><div class="dayitems"></div>`;
  box.querySelector('.del').onclick = e => {
    e.preventDefault(); e.stopPropagation();     // 別順手把分組展開／收起
    clearDay(day, box);
  };
  // 舊卡那組永遠排最前面，其餘依日期排序——卡片本身是照時間來的，容器順序要自己顧
  const boxes = [...feed.querySelectorAll(':scope > .daybox')];
  const after = boxes.find(b => (b.dataset.day || '') > day);
  feed.insertBefore(box, after || feed.querySelector(':scope > .tcard') || null);
  return box.querySelector('.dayitems');
}

// 清掉某一天的紀錄。不可逆，所以先問一次——這是整個看板唯一會刪資料的動作。
async function clearDay(day, box) {
  const n = box.querySelectorAll('.tcard').length;
  const label = day ? day.split('-').slice(1).map(Number).join('/') : '日期不明';
  if (!confirm(`清掉「${label}」這 ${n} 件任務紀錄？\n（進行中的不會被刪，此動作無法復原）`)) return;
  const r = await (await fetch(`/office/history/${selected}?day=${encodeURIComponent(day)}`,
    { method: 'DELETE' })).json();
  if (!r.ok) { $('hint').textContent = `清不掉：${r.error}`; return; }
  $('hint').textContent = `已清 ${r.removed} 件` + (r.skipped ? `（${r.skipped} 件進行中保留）` : '');
  $('feed').dataset.agent = '';   // 逼下一輪整串重建，不然被刪的 DOM 還留著
  feed();
}

// 清掉這位的【全部】工作紀錄。反覆測試之後一天一天刪太瑣碎——但也因此更危險，
// 所以確認訊息要把件數講出來，讓人看得到自己要刪掉多少。進行中的照樣保留。
async function clearAll() {
  const name = (agentsData[selected] || {}).name || selected;
  const n = $('feed').querySelectorAll('.tcard').length;
  if (!confirm(`清掉「${name}」的全部 ${n} 件工作紀錄？\n（進行中的不會被刪，此動作無法復原）`)) return;
  const r = await (await fetch(`/office/history/${selected}?scope=all`, { method: 'DELETE' })).json();
  if (!r.ok) { $('hint').textContent = `清不掉：${r.error}`; return; }
  $('hint').textContent = `已清 ${r.removed} 件` + (r.skipped ? `（${r.skipped} 件進行中保留）` : '');
  $('feed').dataset.agent = '';
  feed();
}

// 收掉目前這塊板（改名封存，不是刪除——那是一次協作的完整紀錄）
async function clearBoard() {
  if (!confirm('收掉目前這塊板？\n（會改名封存在工作區，不會真的刪掉）')) return;
  const r = await (await fetch('/office/board', { method: 'DELETE' })).json();
  $('hint').textContent = r.ok ? `已封存為 ${r.archived}` : `收不掉：${r.error}`;
  board(selected);
}

// 每組標題的計數：幾件、有沒有出事——收起來時也要看得出那天發生過什麼
function dayCounts(feed) {
  for (const box of feed.querySelectorAll(':scope > .daybox')) {
    const cards = box.querySelectorAll('.tcard');
    const bad = [...cards].filter(c => ['error', 'lost', 'stopped'].some(
      k => c.querySelector('.badge')?.classList.contains(k))).length;
    box.querySelector('.cnt').innerHTML = `${cards.length} 件` +
      (bad ? ` <span class="bad">· ${bad} 未完成</span>` : '');
  }
}

// 收合時的一行摘要：完成看回報、進行中看最後一步
const preview = s => (s.report || (s.events || []).slice(-1)[0]?.text || '')
  .replace(/```[\s\S]*?```/g, '〈程式碼〉').replace(/[*`#>]+/g, '').replace(/\s+/g, ' ');

function evEl(e) {
  const d = document.createElement('div');
  d.className = 'ev';
  const at = document.createElement('div'); at.className = 'at'; at.textContent = e.at;
  const tx = document.createElement('div'); tx.className = 'tx';
  d.append(at, tx);
  // 協作模式的工作串沒有頭像也沒有名字——一長串文字流出來卻不知道是誰在講，很沒有著落感。
  // 只標【對話】那幾則（💬）：工具與委派事件已經有自己的記號（▸ ✓ 🤝），再加名牌只是噪音。
  // 主持人的話就是主持人的話——子 agent 的原話在 meeting.md，那是檔案不是工作串，
  // 這裡不假裝分得出來（Tier 1 本來就是主持人轉述）。
  if (agentsData[selected] && agentsData[selected].npc === false && /^💬/.test(e.text || ''))
    d.insertBefore(el('div', '🎤 主持人', 'who'), tx);
  if (e.subcard) d.appendChild(subEl(e.subcard, false));
  return d;
}

// 真的看得到嗎：卡片自己展開還不夠——它可能整組被收在日期分組裡（往上每一層
// details 都要是展開的）。少了這道判斷就會對著看不見的內容慢慢打字，白佔佇列。
function onScreen(node) {
  for (let d = node.closest('details'); d; d = d.parentElement?.closest('details')) {
    if (!d.open) return false;
  }
  return true;
}

// 新事件上畫面：歷史事件與收合中的卡直接塞（沒人看，別排隊擋住後面），
// 使用者看得到的才走佇列逐字浮現。
function appendEv(body, e, live) {
  const d = evEl(e);
  const tx = d.querySelector('.tx');
  // 工作串是【對話】，長程式碼收起來；預覽面板那邊不折（那裡本來就是要看內容的）
  const instant = () => { renderBody(tx, e.text, false, true); body.appendChild(d); keepBottom(); };
  if (!live) return instant();
  const mine = gen;
  enqueue(async rush => {
    if (mine !== gen) return;                       // 期間換了員工：這則作廢
    if (rush || document.hidden || !onScreen(body)) return instant();
    body.appendChild(d);
    keepBottom();
    d.classList.add('in');
    await renderBody(tx, e.text, true, true);
    await sleep(140);                               // 兩則之間留一拍，才像一則一則說
  });
}

// 會議流：子 agent 的新訊息一律【接在主任務串的最底部】、帶人名前綴，依時間交錯。
// 先前只長在各自的子卡裡——子卡嵌在委派事件那個位置（串的中段），三個人同時講話就是
// 三個地方同時冒字，眼睛跟不上（實際回報）。子卡留著當每個人的完整紀錄（預設摺起、不打字）。
function mergeSubs(body, evs, live) {
  const fresh = [];
  for (const e of evs) {
    const s = e.subcard;
    if (!s) continue;
    const key = 'm' + s.id, n = +(body.dataset[key] || 0), sevs = s.events || [];
    for (let i = n; i < sevs.length; i++) fresh.push({ at: sevs[i].at || '', text: `【${s.name}】${sevs[i].text}` });
    body.dataset[key] = sevs.length;
  }
  fresh.sort((a, b) => a.at.localeCompare(b.at));   // 同一輪拿到多人的新話：照時間排，不照誰的卡先
  for (const line of fresh) appendEv(body, line, live);
}

// 委派子卡：同一條任務串裡直接看到「誰接手、做了什麼、回報什麼」
function subEl(s, live) {
  const el = document.createElement('details');
  el.className = 'subcard';
  el.dataset.id = s.id;
  el.innerHTML = `<summary>
      <img class="face sm" src="/avatars/${s.agent}.png" alt=""
           onerror="this.replaceWith(Object.assign(document.createElement('span'),
                    {className:'face sm ph', textContent:'${esc(s.name[0])}'}))">
      <span class="sname">${esc(s.name)}</span>
      <span class="badge"></span><span class="spreview"></span><span class="trange"></span>
    </summary><div class="subbody"></div>`;
  bindToggle(el, s.id);
  sync(el, s, '.subbody', false);   // 子卡不打字：即時對話在主串底部的會議流
  return el;
}

function cardEl(t) {
  const el = document.createElement('details');
  el.className = 'tcard';
  el.dataset.id = t.id;
  el.innerHTML = `<summary><span class="badge"></span>
      <span class="ttitle">${esc(t.task)}</span><span class="trange"></span></summary>
    <div class="tbody"></div>`;
  if (t.workdir) {   // 卡頭的 📁：不展開也能直接開資料夾（展開後的那行仍留著顯示路徑）
    const btn = document.createElement('span');   // 這個函式裡的 el 是卡片節點，不是 el() 建構器
    btn.className = 'wdbtn';
    btn.textContent = '📁';
    btn.title = t.workdir + '（開啟資料夾）';
    btn.onclick = e => { e.preventDefault(); e.stopPropagation(); jumpWs(); };  // 別順手把卡片摺起來
    el.querySelector('summary').insertBefore(btn, el.querySelector('summary .trange'));
  }
  if (t.ts) {   // 🧾 完整紀錄：卡片是投影（截 200 字、150 筆），這顆連到引擎自己的完整紀錄
    const tb = document.createElement('span');
    tb.className = 'wdbtn';
    tb.textContent = '🧾';
    tb.title = `完整紀錄（${(t.engine || 'cogito').toUpperCase()}・session ${t.session || ''}）`;
    tb.onclick = e => { e.preventDefault(); e.stopPropagation(); showTrace(el, t); };
    el.querySelector('summary').insertBefore(tb, el.querySelector('summary .trange'));
  }
  if (t.workdir) {   // 產出目錄：只留 channels/ 之後那段，完整路徑放 tooltip
    const wd = document.createElement('div');
    wd.className = 'wd';
    wd.title = t.workdir + '（點擊跳到上方工作區）';
    wd.textContent = '📁 ' + t.workdir.split('/').slice(-2).join('/');
    wd.onclick = jumpWs;   // 檔案瀏覽在上方固定面板，這裡只是捷徑
    el.querySelector('.tbody').appendChild(wd);
  }
  bindToggle(el, t.id, t);
  return el;
}

// 完整紀錄：兩個引擎的紀錄格式不同、位置不同，橋解成同一種步驟清單。這裡只畫，不猜。
const TRACE_ICON = { user: '🧑‍💼', thinking: '💭', assistant: '💬', tool_use: '▸', tool_result: '↳' };
async function showTrace(cardEl_, t) {
  const body = cardEl_.querySelector('.tbody');
  let box = body.querySelector('.trace');
  if (box) { box.hidden = !box.hidden; cardEl_.open = true; return; }   // 第二次點＝收合／展開，不重抓
  box = document.createElement('div'); box.className = 'trace';
  box.textContent = '讀取完整紀錄…';
  body.appendChild(box); cardEl_.open = true;
  let r;
  try { r = await (await fetch(`/office/trace/${selected}/${t.id}`)).json(); }
  catch (e) { r = { ok: false, error: '取不到：' + e.message }; }
  if (!r.ok) { box.innerHTML = `<div class="err">${esc(r.error || '取不到完整紀錄')}</div>`; return; }
  const head = el('div', '', 'thead');
  head.textContent = `${r.engine.toUpperCase()} · session ${r.session} · ${r.steps.length} 步` +
    (r.has_thinking ? ' · 含動作前的思考' : ' · 沒有推理文字（CLI 的 thinking 只有簽章）');
  head.title = r.source;
  box.replaceChildren(head);
  for (const st of r.steps) {
    const row = el('div', '', 'st ' + st.kind + (st.ok ? '' : ' bad'));
    const meta = el('span', `${st.at} ${TRACE_ICON[st.kind] || '·'} ${st.name || ''}`, 'stm');
    const pre = document.createElement('pre'); pre.textContent = st.text;
    row.append(meta, pre); box.appendChild(row);
  }
}

// 產出檔案不再逐卡列：每張卡的 workdir 都是同一個頻道目錄，逐卡展開＝同一批檔案
// 在每張卡上各印一遍（實測 kanban 一張卡 27 顆 chip，捲三張卡看到 81 顆）。
// 檔案瀏覽統一交給上方固定的 📂 工作區面板；卡上只留 📁 一行當跳轉。
function showFile(pv, row, chip, f, url) {  // preview() 已被收合摘要用掉了
  const on = chip.classList.contains('on');
  row.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  pv.innerHTML = '';
  if (on) { pv.style.display = 'none'; return; }        // 再點一次＝收起來
  chip.classList.add('on');
  pv.style.display = 'block';
  if (f.kind === 'image') {
    const img = el('img');
    img.src = url; img.alt = f.name;
    pv.appendChild(img);
  } else if (f.kind === 'pdf') {
    const fr = document.createElement('iframe');       // 瀏覽器內建的 PDF 檢視器
    fr.src = url;
    pv.appendChild(fr);
  } else {                                              // 文字：抓回來用程式碼區塊顯示
    if (f.ext === 'html') pv.appendChild(sandboxBar(pv, f, url));
    // 容器用 div 不用 pre：renderBody 產生的已經是 pre.code，外面再包一層就變成
    // 「捲軸裡的捲軸」。捲動一律交給 .txt 這一層（見 CSS）。
    const holder = el('div', undefined, 'txt');
    pv.appendChild(holder);
    fetch(url).then(r => r.text()).then(txt => {
      const body = txt.slice(0, 40000);
      if (f.ext === 'md') return renderBody(holder, body, false);   // md 就當 md 排版
      // 其餘檔案【不包圍欄】直接建程式碼區塊：包了的話，檔案內容自己的 ``` 會把外層
      // 提早關掉，整份被切成好幾段、每段一個捲動框（實際踩到的症狀）。
      const pre = el('pre', undefined, 'code');
      if (LANG_BY_EXT[f.ext]) pre.appendChild(el('span', LANG_BY_EXT[f.ext], 'lang'));
      const code = el('code', body);
      pre.appendChild(code);
      holder.appendChild(pre);
      highlight(code, body, LANG_BY_EXT[f.ext] || '');
    });
  }
  keepBottom();
}

// HTML 預設只看原始碼。要真的渲染必須按這顆——它會執行 agent 寫的 JS，
// 風險由使用者當下明確接受，不該默默發生（agent 會被 prompt injection 影響）。
function sandboxBar(pv, f, url) {
  const bar = el('div', undefined, 'sbar');
  const btn = el('button', '⚠️ 以沙箱渲染');
  btn.onclick = () => {
    pv.innerHTML = '';
    pv.appendChild(bar);
    btn.textContent = '↺ 看原始碼';
    btn.onclick = () => showFile(pv, pv.previousElementSibling,
      pv.previousElementSibling.querySelector('.chip.on, .row.on'), f, url);
    const fr = document.createElement('iframe');
    fr.setAttribute('sandbox', 'allow-scripts');   // ⛔ 不給 allow-same-origin：來源不透明
    fr.referrerPolicy = 'no-referrer';
    fr.src = url + '&render=1';
    pv.appendChild(fr);
    pv.appendChild(el('div', '沙箱模式：JS 與 canvas 可執行，但頁面拿不到本站資料、也不能發同源請求（fetch 會失敗）', 'shint'));
  };
  bar.appendChild(btn);
  return bar;
}

const LANG_BY_EXT = { py: 'python', js: 'javascript', ts: 'typescript', go: 'go', sh: 'bash',
                      html: 'html', css: 'css', json: 'json', yaml: 'yaml', yml: 'yaml',
                      md: 'markdown', sql: 'sql', csv: '' };

// 卡片同步：狀態列就地更新、只把【新到的事件】接上去。不整段重畫才有串流感，
// 也不會閃爍、不會弄丟使用者的文字選取與捲動位置。
function sync(el, t, bodySel, live) {
  const b = el.querySelector(':scope > summary .badge');
  b.className = 'badge ' + t.status;
  b.textContent = BADGE[t.status] || t.status;
  // cost/model 都是 cogito 報的【實際】值（協定：未知不送）——有才顯示。
  // 兩個要放一起：花費沒有模型當分母就只是個數字（haiku 跑十輪 vs opus 跑兩輪）。
  const rg = el.querySelector(':scope > summary .trange');
  // cost_est＝單價是估的（模型未登記定價）：標一個 ~，別讓估計值長得跟實價一樣
  rg.textContent = when(t) + (t.cost > 0 ? `｜${t.cost_est ? '~' : ''}$${t.cost.toFixed(4)}` : '')
    + (t.model ? `｜${shortModel(t.model)}` : '');
  rg.title = [t.model && `主 agent 實際跑在 ${t.model}（子 agent 可能各用各的）`,
              t.cost_est && '⚠ 這個模型沒登記單價，金額是用保守估價換算的——token 數是真的，單價可能差好幾倍']
             .filter(Boolean).join('\n');
  const pv = el.querySelector(':scope > summary .spreview');
  if (pv) pv.textContent = preview(t);

  const body = el.querySelector(bodySel);
  const evs = t.events || [];
  for (let i = +(el.dataset.n || 0); i < evs.length; i++) appendEv(body, evs[i], live);
  el.dataset.n = evs.length;

  for (const e of evs) {   // 既有子卡也要跟著長——但只同步、不打字：即時對話在下面的會議流
    const sub = e.subcard && body.querySelector(`.subcard[data-id="${e.subcard.id}"]`);
    if (sub) sync(sub, e.subcard, '.subbody', false);
  }
  mergeSubs(body, evs, live);

  // 報告全文常＝某一則訊息的完整版，重複就不貼。
  // ⚠ 比對前要剝掉投影前綴：事件是「💬 內容」而報告是「內容」，直接 startsWith 永遠不成立，
  //   這道防護等於沒有（實際踩到：同一段話在畫面上出現三次，這是其中一次）。
  // ⚠ 掃【全部】事件而不是最後幾則：報告寫進去之後還會再來「✅ 任務完成」「🧠 學到 N 條」
  //   「✔ 任務完成」，它的雙胞胎轉眼就掉出窗外（實測是倒數第四則）。窗口大小是錯的抽象——
  //   報告要比的是「這段話在這張卡裡出現過沒有」，跟位置無關。單卡事件上限 150，掃全部很便宜。
  const bodyOf = s => (s || '').replace(/^💬\s*/, '').trim();
  const head = bodyOf(t.report).slice(0, 40);
  const dup = head && evs.some(e => bodyOf(e.text).startsWith(head));
  const want = t.report && !dup ? t.report : '';
  let rep = body.querySelector(':scope > .report');
  if (want && !rep) {
    rep = document.createElement('div');
    rep.className = 'report';
    body.appendChild(rep);
  }
  if (rep && rep.dataset.txt !== want) {   // 每輪 poll 都重畫會把捲動位置與選取弄掉
    rep.dataset.txt = want;
    renderBody(rep, want, false);
  }

  el.open = shouldOpen(t);
}

async function feed() {
  if (!selected) return;
  try {
    const r = await (await fetch(`/office/report/${selected}`)).json();
    const f = $('feed');
    if (!r.ok) {
      $('head').innerHTML = `<div class="who">${esc(agentsData[selected]?.name || selected)}</div>
        <div class="task">${esc(r.error)}</div>`;
      f.innerHTML = '';
      f.dataset.agent = '';
      return;
    }
    // 🗑 清全部：反覆測試後一天一天刪太瑣碎。放在標題列而不是每張卡上——這是「整理」
    // 不是「操作某張卡」，混進卡片動線只會讓人誤按。
    $('head').innerHTML = `<div class="who">${r.name}<span class="badge ${r.status}">${BADGE[r.status] || r.status}</span>
        <span class="wipe" title="清掉這位的全部工作紀錄（進行中的會保留）"
              onclick="clearAll()">🗑 清空紀錄</span></div>
      <div class="task">最新任務 · ${r.at}　${esc(r.task)}</div>`;
    const initial = f.dataset.agent !== selected;   // 換人＝整串重建，歷史一次補齊
    if (initial) {
      f.dataset.agent = selected;
      f.innerHTML = '';
      gen++;        // 佇列裡屬於上一位員工的事件作廢
      stuck = true; // 換人一律先看最新的
    }
    for (const [i, t] of (r.history || []).entries()) {
      t.id = t.id ?? 'ix' + i;   // 沒編號的卡不能全叫 undefined——會互搶同一張 DOM 卡
      let el = f.querySelector(`.tcard[data-id="${t.id}"]`);   // 可能在某個日期分組裡
      if (!el) { el = cardEl(t); dayBox(f, t).appendChild(el); }
      // 新開的卡也要逐則浮現：舊寫法是「卡已存在才算 live」，於是每張新任務卡的
      // 開頭幾則會一起瞬間冒出來——那正是還看得到的「一次好幾則」。
      sync(el, t, '.tbody', !initial);
    }
    dayCounts(f);

    const card = $('approvalCard');
    approvalOpen = !!r.approval;   // 球在老闆手上：feed 停止自動捲動與跟隨，畫面別動（見 keepBottom／revealTyping）
    const sig = r.approval ? JSON.stringify([r.approval, r.approval_from, r.approval_meta && r.approval_meta.task_id]) : '';
    if (r.approval && card.dataset.sig === sig) {
      card.style.display = 'block';   // 同一張審批：不重畫。每次 SSE 都會進來這裡，重建 innerHTML 等於按鈕在手指下被換掉
    } else if (r.approval) {
      card.dataset.sig = sig;
      card.style.display = 'block';
      card.className = 'appr';
      const btns = r.approval_from
        // 來自 Slack/TG 的審批只能回原平台按——這裡按了 cogito 也解不開（審批按頻道解析）
        ? `<div class="btns hint">↩︎ 這張審批來自 ${esc(r.approval_from)}，請回 ${esc(r.approval_from)} 回覆 approve / reject</div>`
        : `<div class="btns"><button class="yes" onclick="dispatch('approve')">核准</button>
        <button class="no" onclick="dispatch('reject')">駁回</button></div>`;
      const m = r.approval_meta;
      if (m) {
        // 結構化版面：橋已把 approval.go 的樣板拆好欄位，這裡只負責排，不再靠 markdown
        card.innerHTML = `<div class="ahead"><b>⚠️ 高危操作審批</b><span class="tool">${esc(m.tool)}</span>`
          + `<span class="left" id="apprLeft"></span></div>`
          + `<pre class="code wrap"><code>${esc(apprParams(m.params))}</code></pre>`
          + `<div class="tid">任務 ID：${esc(m.task_id)}</div>` + btns;
        apprDeadline = r.approval_left == null ? null : Date.now() + r.approval_left * 1000;
        tickAppr();
      } else {
        // 解析不了（樣板改版、舊狀態復原）：退回原文渲染——看得到永遠優先於排得漂亮
        card.innerHTML = `<div class="tx"></div>` + btns;
        renderBody(card.querySelector('.tx'), r.approval, false);
        apprDeadline = null;
      }
    } else { card.style.display = 'none'; card.dataset.sig = ''; apprDeadline = null; }
    keepBottom();   // 必須在審批卡渲染【之後】：它會把 feed 擠短，先貼底等於沒貼
  } catch { /* 後端暫時斷線：下輪再試 */ }
}

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 審批卡的參數：多半是 {"command":"…"} 這種單鍵 JSON——直接給指令本體，包一層 JSON
// 對簽名的人只是雜訊。其他形狀就縮排排開；連 JSON 都不是（被截斷等）就原樣顯示。
function apprParams(p) {
  try {
    const o = JSON.parse(p);
    if (o && typeof o === 'object' && typeof o.command === 'string' && Object.keys(o).length === 1)
      return '$ ' + o.command;
    return JSON.stringify(o, null, 2);
  } catch { return p; }
}

// 倒數：基準秒數由橋算（兩邊時鐘不同步，基準只能有一份），瀏覽器只負責往下數。
// 數到 0 不收卡——收卡的訊號是 cogito 的自動拒絕訊息，倒數只是給人看的預告。
let apprDeadline = null;
function tickAppr() {
  const el = document.getElementById('apprLeft');
  if (!el || apprDeadline == null) return;
  const s = Math.max(0, Math.round((apprDeadline - Date.now()) / 1000));
  el.textContent = s > 0 ? `⏳ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} 後自動拒絕`
                         : '⏳ 已逾時，等待自動拒絕';
  el.classList.toggle('urgent', s > 0 && s < 60);
}
setInterval(tickAppr, 1000);

// 畫布聯動：WebGL 內點 NPC → 右欄切到該員工（同源 iframe，來源與格式都驗過才收）
window.addEventListener('message', e => {
  if (e.origin !== window.location.origin) return;
  const d = e.data;
  if (d && d.source === 'office-canvas' && typeof d.agent === 'string' && agentsData[d.agent]) {
    pick(d.agent);
  }
});

// SSE 即時推播（失效通知）：收到就回抓對應資料；斷線 EventSource 自動重連。
// 慢速輪詢留著當保險（後端重啟等 SSE 銜接空窗）。
//
// ⚠ 分頁隱藏時一定要關掉：SSE 是【永不結束】的連線，而 HTTP/1.1 每個 origin 只有 6 條
// 並行額度。開著幾個背景分頁就會把額度佔滿，之後所有 fetch 進入無限排隊——畫面不會報錯，
// 只是名冊與工作串永遠空白（實測踩過，最難查的一種「壞掉」）。
let es = null;
function openStream() {
  if (es || document.hidden) return;
  es = new EventSource('/office/stream');
  es.onmessage = e => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.alert) cue(ev.alert);          // 不管在看哪一位，該響的都要響
  costcard();                           // 花費也是全員視角
  inboxcard();                          // 收件匣是全員視角：任何人的事都可能進來
    if (ev.type === 'roster') roster();
    else if (ev.type === 'agent') {
      if (ev.id === selected) {
        feed();
        // 任務收工＝產出落地了：工作區面板開著就順手刷新，不用手動按 ↻
        if ((ev.alert === 'done' || ev.alert === 'error') && $('ws').open) workspace(selected, wsPath);
        // 看板每一則事件都可能改到 board.json（主持人在推進任務），開著就跟著更新
        if (!$('board').hidden && $('board').open) board(selected);
      }
      roster();
    }
  };
}
function closeStream() { if (es) { es.close(); es = null; } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return closeStream();
  openStream();
  roster(); feed();          // 回到前景先補一次，不必等下一輪推播
});
addEventListener('pagehide', closeStream);   // 分頁關掉/切走：立刻還回連線額度
openStream();

roster();
capcard();
// 能力也會變（cogito 加掛 MCP、換技能；CLI 跑完會回報它自己那份）。輪得比名冊慢——
// 這種事以分鐘計，而且橋端本來就有五分鐘快取，問太勤只是白跑。
setInterval(capcard, 30000);
inboxcard();
setInterval(inboxcard, 30000);
setInterval(roster, 10000);
setInterval(feed, 8000);
</script>
</body>
</html>
